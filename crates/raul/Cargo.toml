[package]
name = "raul"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Human-facing PM CLI — styled plan views powered by mp JSON"

[lib]
name = "raul"
path = "src/lib.rs"

[[bin]]
name = "raul"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"] }
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
crossterm = { workspace = true }
mp-model = { path = "../mp-model" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "crossterm_0_29"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
