<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none" role="img" aria-label="master-plan banner option 5: blueprint floor plan">
  <title>Option 5 banner — blueprint</title>

  <defs>
    <pattern id="grid5b" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- background with grid -->
  <rect width="480" height="120" fill="#0f172a"/>
  <rect width="480" height="120" fill="url(#grid5b)" opacity="0.8"/>

  <!-- card border -->
  <rect x="6" y="6" width="468" height="108" rx="8" fill="none" stroke="#22d3ee" stroke-width="1.5"/>

  <!-- rooms -->
  <rect x="32" y="24" width="120" height="36" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="160" y="24" width="160" height="50" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="328" y="24" width="120" height="64" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="32" y="68" width="180" height="38" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="220" y="82" width="100" height="24" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="328" y="92" width="120" height="14" fill="none" stroke="#22d3ee" stroke-width="1.5"/>

  <!-- door gaps (knocked out) -->
  <line x1="152" y1="42" x2="160" y2="42" stroke="#0f172a" stroke-width="3"/>
  <line x1="152" y1="86" x2="160" y2="86" stroke="#0f172a" stroke-width="3"/>
  <line x1="320" y1="55" x2="328" y2="55" stroke="#0f172a" stroke-width="3"/>
  <line x1="240" y1="74" x2="240" y2="82" stroke="#0f172a" stroke-width="3"/>
  <line x1="328" y1="56" x2="328" y2="92" stroke="#0f172a" stroke-width="3"/>

  <!-- center accent -->
  <circle cx="240" cy="60" r="2" fill="#a78bfa"/>

  <!-- wordmark -->
  <text x="240" y="113" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle" letter-spacing="1">master-plan</text>
</svg>