<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="master-plan logo option 2: terminal with checklist">
  <title>Option 2 — terminal + checklist</title>

  <!-- main card -->
  <rect x="4" y="4" width="56" height="56" rx="11"
        fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>

  <!-- prompt indicator (terminal cursor) -->
  <rect x="12" y="13" width="6" height="2.5" rx="1.25" fill="#22d3ee"/>

  <!-- row 1: completed -->
  <rect x="12" y="22" width="5" height="5" rx="1"
        fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <polyline points="13.5,24.5 15,26 17.5,23"
            fill="none" stroke="#22d3ee" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="20" y="23.5" width="24" height="2.5" rx="1.25"
        fill="#22d3ee" opacity="0.55"/>

  <!-- row 2: pending -->
  <rect x="12" y="34" width="5" height="5" rx="1"
        fill="none" stroke="#475569" stroke-width="1.5"/>
  <rect x="20" y="35.5" width="30" height="2.5" rx="1.25" fill="#94a3b8"/>

  <!-- row 3: pending (dimmer) -->
  <rect x="12" y="46" width="5" height="5" rx="1"
        fill="none" stroke="#475569" stroke-width="1.5"/>
  <rect x="20" y="47.5" width="22" height="2.5" rx="1.25" fill="#64748b"/>
</svg>