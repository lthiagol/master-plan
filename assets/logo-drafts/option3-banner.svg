<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none" role="img" aria-label="master-plan banner option 3: two interlocking L-brackets">
  <title>Option 3 banner — mp + raul duality</title>

  <!-- background -->
  <rect width="480" height="120" fill="#0f172a"/>

  <!-- top-left bracket (mp writer, solid cyan) — scaled-up -->
  <path d="M 24 24 L 196 24 L 196 56 L 120 56 L 120 96 L 24 96 Z" fill="#22d3ee"/>

  <!-- bottom-right bracket (raul reader, outlined violet) -->
  <path d="M 456 96 L 284 96 L 284 64 L 360 64 L 360 24 L 456 24 Z"
        fill="none" stroke="#a78bfa" stroke-width="6" stroke-linejoin="round"/>

  <!-- center junction -->
  <circle cx="240" cy="60" r="6" fill="#94a3b8"/>

  <!-- wordmark -->
  <text x="240" y="113" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">master-plan</text>
</svg>