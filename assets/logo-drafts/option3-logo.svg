<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="master-plan logo option 3: two interlocking L-brackets">
  <title>Option 3 — mp + raul duality (interlocking L-brackets)</title>

  <!-- background card -->
  <rect x="4" y="4" width="56" height="56" rx="11"
        fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- top-left bracket (mp, solid cyan) -->
  <path d="M 12 12 L 30 12 L 30 20 L 20 20 L 20 30 L 12 30 Z" fill="#22d3ee"/>

  <!-- bottom-right bracket (raul, outlined violet) -->
  <path d="M 52 52 L 34 52 L 34 44 L 44 44 L 44 34 L 52 34 Z"
        fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- center junction dot -->
  <circle cx="32" cy="32" r="2" fill="#94a3b8"/>
</svg>