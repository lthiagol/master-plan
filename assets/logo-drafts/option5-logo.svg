<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="master-plan logo option 5: blueprint floor plan">
  <title>Option 5 — blueprint</title>

  <defs>
    <pattern id="grid5" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 6 0 L 0 0 0 6" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- background card with grid -->
  <rect x="4" y="4" width="56" height="56" rx="11"
        fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="5.5" y="5.5" width="53" height="53" rx="9.5" fill="url(#grid5)"/>

  <!-- rooms -->
  <rect x="10" y="11" width="18" height="16"
        fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="32" y="11" width="20" height="18"
        fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="10" y="31" width="16" height="20"
        fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="30" y="33" width="22" height="18"
        fill="none" stroke="#22d3ee" stroke-width="1.5"/>

  <!-- doorway gaps (white knocks) -->
  <line x1="28" y1="20" x2="32" y2="20" stroke="#0f172a" stroke-width="2"/>
  <line x1="26" y1="31" x2="26" y2="35" stroke="#0f172a" stroke-width="2"/>
  <line x1="30" y1="42" x2="34" y2="42" stroke="#0f172a" stroke-width="2"/>

  <!-- center accent -->
  <circle cx="28" cy="42" r="1.5" fill="#a78bfa"/>
</svg>