<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none" role="img" aria-label="master-plan banner option 2: terminal with checklist">
  <title>Option 2 banner — terminal + checklist</title>

  <!-- background card with cyan border -->
  <rect x="6" y="6" width="468" height="108" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>

  <!-- prompt indicator -->
  <rect x="22" y="22" width="8" height="3.5" rx="1.75" fill="#22d3ee"/>

  <!-- row 1: completed -->
  <rect x="22" y="36" width="6" height="6" rx="1.2" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <polyline points="23.7,38.8 25.5,40.6 28.5,37" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="34" y="38" width="320" height="3" rx="1.5" fill="#22d3ee" opacity="0.55"/>

  <!-- row 2: completed -->
  <rect x="22" y="50" width="6" height="6" rx="1.2" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <polyline points="23.7,52.8 25.5,54.6 28.5,51" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="34" y="52" width="280" height="3" rx="1.5" fill="#22d3ee" opacity="0.55"/>

  <!-- row 3: pending -->
  <rect x="22" y="64" width="6" height="6" rx="1.2" fill="none" stroke="#475569" stroke-width="1.5"/>
  <rect x="34" y="66" width="380" height="3" rx="1.5" fill="#94a3b8"/>

  <!-- row 4: pending -->
  <rect x="22" y="78" width="6" height="6" rx="1.2" fill="none" stroke="#475569" stroke-width="1.5"/>
  <rect x="34" y="80" width="340" height="3" rx="1.5" fill="#94a3b8"/>

  <!-- row 5: pending (dimmer) -->
  <rect x="22" y="92" width="6" height="6" rx="1.2" fill="none" stroke="#475569" stroke-width="1.5"/>
  <rect x="34" y="94" width="240" height="3" rx="1.5" fill="#64748b"/>

  <!-- wordmark -->
  <text x="240" y="111" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#22d3ee" text-anchor="middle" letter-spacing="1">master-plan</text>
</svg>