<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none" role="img" aria-label="master-plan banner option 1: humans and agents working together">
  <title>Option 1 banner — humans + agents</title>

  <defs>
    <pattern id="bg1" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="480" height="120" fill="#0f172a"/>
  <rect width="480" height="120" fill="url(#bg1)" opacity="0.5"/>

  <!-- left: human silhouette -->
  <circle cx="50" cy="40" r="10" fill="#22d3ee"/>
  <path d="M 36 70 Q 36 54 50 54 Q 64 54 64 70 L 64 92 L 36 92 Z" fill="#22d3ee"/>

  <!-- right: agent chip -->
  <rect x="406" y="30" width="32" height="32" rx="3" fill="#a78bfa"/>
  <rect x="400" y="34" width="6" height="5" fill="#a78bfa"/>
  <rect x="400" y="43" width="6" height="5" fill="#a78bfa"/>
  <rect x="400" y="52" width="6" height="5" fill="#a78bfa"/>
  <rect x="438" y="34" width="6" height="5" fill="#a78bfa"/>
  <rect x="438" y="43" width="6" height="5" fill="#a78bfa"/>
  <rect x="438" y="52" width="6" height="5" fill="#a78bfa"/>
  <rect x="412" y="24" width="5" height="6" fill="#a78bfa"/>
  <rect x="427" y="24" width="5" height="6" fill="#a78bfa"/>
  <rect x="412" y="62" width="5" height="6" fill="#a78bfa"/>
  <rect x="427" y="62" width="5" height="6" fill="#a78bfa"/>
  <!-- chip inner -->
  <rect x="416" y="40" width="12" height="12" rx="1" fill="#0f172a"/>

  <!-- center: shared plan card -->
  <rect x="170" y="32" width="140" height="56" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1"/>
  <rect x="180" y="42" width="6" height="3" rx="1.5" fill="#22d3ee"/>
  <rect x="190" y="42" width="90" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="180" y="52" width="100" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="180" y="62" width="80" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="180" y="72" width="60" height="3" rx="1.5" fill="#64748b"/>

  <!-- connection lines: figure → plan -->
  <path d="M 68 56 Q 120 56 170 56" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3,3" fill="none" opacity="0.6"/>
  <path d="M 404 56 Q 350 56 310 56" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="3,3" fill="none" opacity="0.6"/>

  <!-- wordmark -->
  <text x="240" y="110" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">master-plan</text>
</svg>