<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="master-plan logo option 1: humans and agents">
  <title>Option 1 — humans + agents collaborating</title>

  <!-- main card -->
  <rect x="4" y="4" width="56" height="56" rx="11"
        fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- left: human silhouette (cyan) -->
  <circle cx="15" cy="20" r="4" fill="#22d3ee"/>
  <path d="M 9 38 Q 9 28 15 28 Q 21 28 21 38 L 21 46 L 9 46 Z" fill="#22d3ee"/>

  <!-- right: agent chip (violet) with pins -->
  <rect x="42" y="14" width="12" height="12" rx="1.5" fill="#a78bfa"/>
  <rect x="40" y="17" width="2" height="2" fill="#a78bfa"/>
  <rect x="40" y="21" width="2" height="2" fill="#a78bfa"/>
  <rect x="54" y="17" width="2" height="2" fill="#a78bfa"/>
  <rect x="54" y="21" width="2" height="2" fill="#a78bfa"/>
  <rect x="46" y="12" width="2" height="2" fill="#a78bfa"/>
  <rect x="50" y="12" width="2" height="2" fill="#a78bfa"/>
  <rect x="46" y="26" width="2" height="2" fill="#a78bfa"/>
  <rect x="50" y="26" width="2" height="2" fill="#a78bfa"/>
  <!-- inner detail on chip -->
  <rect x="46" y="18" width="4" height="4" rx="0.5" fill="#0f172a"/>

  <!-- center: shared plan card -->
  <rect x="26" y="40" width="12" height="14" rx="1.5"
        fill="#1e293b" stroke="#475569" stroke-width="0.75"/>
  <rect x="28.5" y="43" width="7" height="1.5" rx="0.75" fill="#94a3b8"/>
  <rect x="28.5" y="47" width="5" height="1.5" rx="0.75" fill="#94a3b8"/>
  <rect x="28.5" y="51" width="3.5" height="1.5" rx="0.75" fill="#64748b"/>
</svg>