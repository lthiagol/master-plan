# mp-flow stages manifest — test fixture (minimal but schema-shaped)
#
# Mirrors templates/skills/mp-flow/stages.toml closely enough to exercise
# every check in scripts/mp_flow_lint.py: 12 stages numbered 1..12, each
# with a name / role / summary / commands, a review_loop block, and a
# [role_binding.*] summary that agrees with the per-stage roles.
#
# Deliberately tiny: the fixture exists to pin the lint's accept/reject
# behavior, not to document the real flow. Stage names are generic.

[[stages]]
number = 1
name = "Draft"
role = "coordinator"
summary = "Write the spec."
commands = ["mp interview checklist"]

[[stages]]
number = 2
name = "Groom"
role = "coordinator"
summary = "Refine the spec."
commands = ["mp milestone groom"]

[[stages]]
number = 3
name = "Specify"
role = "coordinator"
summary = "Lock the spec."
commands = ["mp milestone set-spec-status <id> ready"]

[[stages]]
number = 4
name = "Approve"
role = "coordinator"
summary = "Pass the gates."
commands = ["mp milestone approve <id>"]

[[stages]]
number = 5
name = "Claim & execute"
role = "runner"
summary = "Claim and execute the steps."
commands = ["mp milestone set-status <id> in-progress"]

[[stages]]
number = 6
name = "Self-review"
role = "runner"
summary = "Round-1 self-review."
commands = ["mp reviews finding add <id> --phase self"]

[[stages]]
number = 7
name = "Complete"
role = "runner"
summary = "Mark the milestone complete."
commands = ["mp milestone complete <id>"]

[[stages]]
number = 8
name = "External review"
role = "coordinator"
summary = "Round-2 external review."
commands = ["mp reviews finding list <id>"]

[[stages]]
number = 9
name = "Remediate"
role = "runner"
summary = "Patch per the findings."
commands = ["mp reviews finding resolve <id> <finding-id>"]

[[stages]]
number = 10
name = "Re-review"
role = "coordinator"
summary = "Verify the remediation."
commands = ["mp milestone verify <id>"]

[[stages]]
number = 11
name = "Document"
role = "coordinator"
summary = "Capture the lesson."
commands = ["mp note add --title \"...\""]

[[stages]]
number = 12
name = "Hand off"
role = "coordinator"
summary = "Close out the milestone."
commands = ["git commit -m \"...\""]

[review_loop]
from = 8
to = 9
exit = 10
description = "Stages 8 -> 9 -> 10 iterate until stage 10 is clean."

[role_binding.coordinator]
stages = [1, 2, 3, 4, 8, 10, 11, 12]
sub_skills = ["mp-flow", "mp-coordinator"]

[role_binding.runner]
stages = [5, 6, 7, 9]
sub_skills = ["mp-flow", "mp-runner"]
