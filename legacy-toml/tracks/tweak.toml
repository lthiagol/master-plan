[[items]]
id = "TW-07"
title = "Validate AC verification/tests fields are runnable or manual-literal"
status = "done"
effort = "S"
problem = "M41/M44/M45 shipped 5 acceptance criteria whose 'verification' (and step 'tests') values glue human prose onto shell commands (e.g. 'cargo tree -p mp shows no ratatui/crossterm', 'cargo test -p mp + mp --help review ...', '... && manual raul smoke test'). mp milestone verify then fails to execute them. The AGENTS.md step-testing convention requires a single path/command or a 'manual: accepted — <reason>' literal, but nothing enforces it, so the mistake recurs."
done_when = "mp validate emits a warning (or error, per interview) when a verification/tests value is neither a single clean command/path nor a 'manual:' literal; existing repo ACs audited and the 5 malformed M41/M44/M45 strings either corrected or marked manual."
verification = "cargo test -p mp for the new validator + mp validate green on the repo"
steps = []
evidence = "Completed in M47 S11: verification field validator"
created = "2026-06-29"
completed = "2026-06-29"
archived_at = ""

[[items]]
id = "TW-08"
title = "mp milestone set-priority command"
status = "done"
effort = "S"
problem = "There is no command to set a milestone's priority; mp milestone update --json ignores the priority field, so priorities cannot be changed via mp (only by hand-editing TOML, which violates the plan-write-via-mp rule). Add a set-priority command so milestones can be prioritized for execution sequencing."
done_when = "mp milestone set-priority <id> <high|normal|low> sets the priority; it round-trips through mp show; unknown levels error."
verification = "crates/mp/tests/milestone_priority.rs"
steps = []
evidence = "Added mp milestone set-priority <id> <urgent|high|normal|low>. Domain function in milestone.rs validates against VALID_PRIORITIES. 5 integration tests in milestone_priority.rs."
created = "2026-07-01"
completed = "2026-07-01"
archived_at = ""

[[items]]
id = "TW-09"
title = "mp track list surfaces individual items (id, title, status), not just group counts"
status = "done"
effort = "S"
problem = "mp track list and mp list tracks return only group summaries (kind + total/pending/active counts) and omit individual track ids/titles/status. A user or agent cannot find a specific track's id from the list output — they must call mp track show <kind> and grep items[]. This is the same agent-read-ergonomics gap M79 addressed, on the track surface."
done_when = "mp track list (and mp list tracks) include individual tracks with id, title, and status in their default output (or via an --items flag); a flat listing lets a caller find any track's id in one command."
verification = "crates/mp/tests/track_listing.rs"
steps = []
evidence = "Added --items to mp track list and mp list tracks. When set, each track group includes individual items (id, title, status). Threaded --fields support through cmd_track. 4 tests in track_listing.rs."
created = "2026-07-01"
completed = "2026-07-01"
archived_at = ""

