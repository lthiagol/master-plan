key = "success"
title = "What success looks like"
prompt = "How will you know this worked? Vague is OK — we'll sharpen this in the charter."
body = "Agents can autonomously complete a full milestone lifecycle in this repo (dogfooding test passes). mp validate reports zero errors. CI pipeline is green. Another agent can pick up SESSION-HANDOFF.md and execute without human intervention. All 12 spec-ready milestones can be completed autonomously in order."
