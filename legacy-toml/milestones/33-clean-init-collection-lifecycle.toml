[intent]
outcome = "mp init produces clean, valid collections and a config whose location matches the chosen --plan-dir, and decision/idea records can be removed through the CLI."

[problem]
description = "Field testing (lazybrew adoption, I-03/I-10/I-12) found: (1) the init preset hardcodes location='master-plan' even when --plan-dir .mp is used, requiring a post-init config fix; (2) init emits empty placeholder [[decisions]]/[[ideas]]/[[items]] rows with id='', which surface as bogus records in `mp decision list`/`mp idea list`; (3) there is no CLI way to delete a decision or idea record (mp decision has only add/list; mp idea has no hard delete), so the empty placeholders could only be removed by hand-editing TOML - violating the never-hand-edit rule."

