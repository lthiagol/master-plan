[scope]
in_scope = [
    "Theme system: extensible palette struct, ships with catppuccin (latte, frappe, macchiato, mocha) and dracula flavors",
    "Config flags: ui.color = true|false, ui.icons = none|ascii|unicode, ui.theme = <name>; --color CLI flag",
    "Terminal-aware table rendering via terminal_size crate: detect COLUMNS, truncate/wrap gracefully, no broken layouts",
    "Milestone list: colored status badges, unicode icons (planned, in-progress, done, blocked, deferred)",
    "Milestone detail: syntax-highlighted sections (spec status, ACs pass/fail, dependency tree, step list with status icons)",
    "TUI toggle: keybinding (h) to hide/show done milestones; persisted via config",
    "Color-coded AC status (green=passed, yellow=pending, red=failed) in CLI and TUI",
    "raul milestone approve <id>: delegates to mp milestone approve",
    "raul milestone block <id> --reason / unblock <id>: delegates to mp",
    "raul milestone set-dependency <id> --depends-on <dep>: delegates to mp milestone update",
    "raul milestone request-grooming <id> --reason: creates a grooming-request annotation",
    "raul step split <milestone> <step> --into N: delegates to mp milestone step split",
    "All review actions available via raul CLI and integrated into the TUI (context menus, keybindings)",
]
out_of_scope = [
    "Full markdown rendering (milestones are TOML; we highlight fields, not render arbitrary markdown)",
    "Editing milestone spec fields (title, intent, scope) — that is spec editing, not review",
    "Creating milestones from scratch in raul (delegated to mp milestone create)",
    "raul wp split (no clean mp target — mp milestone wp has add/update only, no split)",
    "Custom user-defined themes (palettes are hardcoded; only selection is configurable)",
]

