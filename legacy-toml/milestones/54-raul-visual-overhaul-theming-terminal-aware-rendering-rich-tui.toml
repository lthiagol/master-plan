[milestone]
id = "54"
title = "raul TUI v2 — visual overhaul + review workflow actions"
slug = "raul-visual-overhaul-theming-terminal-aware-rendering-rich-tui"
spec_status = "verified"
execution_status = "done"
depends_on = ["77"]
effort = "S"
risk = "low"
change_kind = ""
priority = "normal"
created = "2026-06-29"
updated = "2026-07-01"
blocked_at = ""
block_reason = ""
blocked_by = ""
target_version = "2.0.0-rc.1"

[intent]
outcome = "raul is a modern, themeable, terminal-aware human surface with the full review workflow inline: humans view, approve, block, unblock, set dependencies, request grooming, and split steps entirely through raul CLI/TUI without dropping to mp — with catppuccin/dracula theming, status icons, and width-aware tables."

[problem]
description = "Two gaps in raul today. (1) Visually flat: tables do not respect terminal width (broken layouts), no color theme system, no icons, TUI lacks visual density (status colors, hide-done toggle, rich detail rendering). (2) Read-only: a human reviewer who wants to approve a milestone, block it, add a dependency, request grooming, or split a step must leave raul and run mp commands directly. The reviewer workflow is review -> act (approve/block/request-change) -> verify; raul handles review and verify but not act. Note: raul already has 'approval approve <annotation-id>' (M46) which resolves an annotation-approval-request then approves — this milestone adds direct 'raul milestone approve <id>' for the no-annotation case. Decision (deferred): both coexist for now; revisit deprecating one surface once both ship and real usage patterns clarify which entry point users prefer."

