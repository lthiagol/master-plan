[intent]
outcome = "AGENTS.md files are concise, non-redundant, and agent-friendly: root is a tight session-start entry point, master-plan/AGENTS.md is the normative workflow reference."

[problem]
description = "Two AGENTS.md files (root 157 lines + master-plan 389 lines = 546 lines) overlap. Root repeats meta-plan detail that belongs in master-plan; master-plan has long workflow tables, repeated intake-routing text, and section 3.0-3.8 verbosity that bloats agent context without adding normative value."

