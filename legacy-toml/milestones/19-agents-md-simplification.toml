[[steps]]
id = "S1"
work_package = "WP1"
order = 1
action = "Trim root AGENTS.md to <=100 lines: keep session-start commands block, project intro table, design principles (brief), dev commands, session log, pointers to master-plan/AGENTS.md and docs/. Remove meta-plan detail duplicated in master-plan/AGENTS.md (charter, meta master-plan table, flows we follow, references list)."
files = ["AGENTS.md"]
tests = "./scripts/check-docs.sh"
done_when = "wc -l AGENTS.md <= 100; no workflow detail duplicated in master-plan/AGENTS.md"
status = "done"
covers_ac = ["AC-01"]
depends_on_steps = []

[[steps]]
id = "S2"
work_package = "WP2"
order = 2
action = "Trim master-plan/AGENTS.md to <=250 lines: keep section 1 non-negotiable rules, 1a plan/code zone table, 2 tooling table + intake routing, 3.1/3.1a/3.2/3.2a/3.2b/3.3/3.3a/3.4/3.5/3.6/3.7/3.8 workflows (condensed), 4 spec lifecycle gates, 5 output conventions, 6 triggers, 7 references. Cut redundant intake-routing prose, verbose workflow tables that restate commands, and section 3.0 brief workflow if covered by pointer."
files = ["master-plan/AGENTS.md"]
tests = "./scripts/check-docs.sh"
done_when = "wc -l master-plan/AGENTS.md <= 250; all non-negotiable rules + workflows 3.1-3.7 + gates + conventions + triggers retained"
status = "done"
covers_ac = ["AC-02"]
depends_on_steps = []

[[steps]]
id = "S3"
work_package = "WP2"
order = 3
action = "Verify cross-references: every file path mentioned in either AGENTS.md exists (docs/AGENT-PLAYBOOK.md, docs/SPEC.md, docs/MP-COMMANDS.md, docs/WALKTHROUGH.md, master-plan/AGENTS.md, etc.). Fix any broken refs."
files = [
    "AGENTS.md",
    "master-plan/AGENTS.md",
]
tests = "./scripts/check-docs.sh"
done_when = "All referenced files exist; no broken links"
status = "done"
covers_ac = ["AC-03"]
depends_on_steps = []

