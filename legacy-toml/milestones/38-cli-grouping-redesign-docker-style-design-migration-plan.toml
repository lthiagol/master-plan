[intent]
outcome = "A documented, human-friendly hierarchical command grouping for mp (noun-first object groups like docker container/network/image) plus a hard-rename plan that repoints raul shell-outs in-lockstep (clean 2.0 break, no aliases), so the CLI is regrouped as part of the single 2.0 release that ships mp and raul together."

[problem]
description = "mp's top-level command surface is a flat list of ~40 mixed nouns and verbs (init, brief, milestone, step, backlog, idea, decision, track, session, archive, restore, purge, groom, challenge, digest, note, delta, validate, sync, status, next, next-step, path, execution, git, ...). Verb-first and standalone commands (archive, restore, purge, groom, challenge, digest, note, delta) are inconsistent with the noun-first object commands (milestone, step, backlog), making the CLI hard to discover, teach, and remember. There is also a near-duplicate pair: mp next and mp next-step. Inspired by docker (docker container/network/image/volume + a small set of top-level lifecycle verbs), we want a consistently grouped CLI. This is a breaking change to the CLI surface and the CLI IS the agent/skill API, so it must be designed carefully and shipped as a 2.0 clean break with hard renames (no aliases); mp and raul ship together so raul is repointed in-lockstep."

