[scope]
in_scope = [
    "Audit the current ~40 top-level commands and classify each as object-group vs lifecycle verb",
    "Produce a target command taxonomy/tree: object groups (plan, milestone, step, wp, brief, backlog, idea, decision, track, session, release, changelog) + a small set of top-level lifecycle verbs (init, validate, sync, doctor, status, next, path, execution, git)",
    "Map every current command to its target path (e.g. archive/restore/purge -> <object> archive/restore; groom/challenge -> milestone groom/challenge; digest/note/delta/export -> report or <object>)",
    "Hard-rename plan: every renamed verb is a hard rename (no aliases); raul shell-outs repointed in-lockstep since mp and raul ship together in the same 2.0 release (D-012)",
    "Freeze the --format json output contract as the stable programmatic agent API (verb/grouping changes must NOT change JSON shapes)",
    "Impact assessment across: master-planner SKILL.md, AGENTS.md, MP-COMMANDS.md, AGENT-PLAYBOOK.md, EDGE-CASES.md, golden scenario tests, integration tests, fixtures",
    "Versioning decision: scope as a 2.0 clean-break major bump with no transition period",
    "Open design question: ensure M36/M37 new commands (mp release, mp changelog) and M32-M35 new commands are named into the new taxonomy rather than retrofitted later",
    "NOTE: this milestone is a design/planning stub; execution is M45 (depends on M38 design + M41 + M43 + M44): taxonomy, verb migration, raul repoint, docs+skill update, tests",
]
out_of_scope = [
    "Changing --format json output shapes (the stable agent API; only verbs/grouping change)",
    "GUI/TUI (CLI surface only)",
    "Renaming the `mp` binary itself",
]

