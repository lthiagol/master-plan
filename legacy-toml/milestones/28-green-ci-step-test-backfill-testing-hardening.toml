blocked_at = ""
block_reason = ""
blocked_by = ""

[intent]
outcome = "Every plan step points to a real, runnable test; `mp validate` is green on master; and CI runs build, validate, fixtures and scenarios to green on every push."

[problem]
description = "mp 1.1.x introduced gate G10 (every step must declare a test). 97 of 171 steps across M07-M22 have empty `tests:`, so `mp validate` exits 2 and CI has been red on master (runs #1-#12 and #15). A deeper audit shows the problem extends beyond empty fields: of the remaining steps, 11 use `manual:` (unautomated), 9 use comma-lists, 2 use ad-hoc shell commands, and 12 reference `.rs` test files that do not exist on disk (e.g. `schema_validate.rs` claimed by M07-S1). Only ~40 steps (24%) have a clean, existing test reference. Because `mp validate` fails first, the downstream `make test-fixtures` step never executes, so fixture and scenario coverage is effectively unverified in CI. The plan's testing surface is simultaneously incomplete, partially broken, and unverified."

