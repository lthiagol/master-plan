[scope]
in_scope = [
    "Backfill non-empty, runnable `tests:` on all 97 G10-flagged steps across M07-M22 (concentrated in M17=20 and M21=21)",
    "Create the 12 missing referenced test files (e.g. schema_validate.rs, concurrency.rs, note.rs, mini_schema_*.rs, track_render_parity.rs) or repoint steps to existing tests",
    "Standardize the `tests` field format to a single path or single command; eliminate comma-lists and ad-hoc variants",
    "Convert the 11 `manual:` checks into automated tests where feasible, or formally mark them manual-accepted with rationale",
    "Restructure CI so validate, fixtures, and scenarios run and report independently (continue-on-error or split jobs) so one failure does not mask others",
    "Document the step-testing convention (what goes in a step's `tests`) in AGENTS.md or a TESTING note",
]
out_of_scope = [
    "Changing G10 semantics or the validator's strictness model",
    "New product features unrelated to testing or CI",
    "Migrating CI off Gitea Actions or off the custom ci-mp container image",
    "Re-scoping or splitting existing milestones M01-M27",
]

