[intent]
outcome = "Agents and humans find plan content with mp search instead of grepping master-plan/ or looping mp show. Search is reworked for M92 JSON-on-disk: source paths point at .json files, artifact types match how agents think (ac, step, wp, title, idea, backlog, track, decision, all), and results can include the full matched fragment (whole AC, step, or WP object) — not only a snippet. Skills and AGENTS.md treat mp search as the default discovery path."

[problem]
description = "M53 shipped mp search with DIY fuzzy scoring over milestones, steps (partial), ideas, backlog, tracks, and decisions. It did not get lost — but agents still grep or fan out mp show because: (1) --type lacks first-class ac and wp scopes (AC hits appear as milestone with matched_field ac.AC-NN); (2) work_packages are not indexed; (3) results return snippets only, forcing a second mp show to get the full fragment; (4) source paths hardcode .toml slugs, which breaks mental model once M92 moves plan artifacts to JSON; (5) mp search is under-documented in skills vs grep. M93 fragment reads (ac show, --fields by id) pair naturally with search that returns enough context to jump straight to the right mp command without document assembly."

