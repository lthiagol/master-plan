[intent]
outcome = "Reviewing a milestone spec is fast and focused: a human (via raul) or an agent (via mp) gets a condensed, review-oriented view of a lean JSON spec — outcome, problem, scope, ACs with coverage and evidence status, open questions, and force-bypass flags — plus an AC-to-step-to-evidence traceability matrix and a what-changed-since-last-approval diff, without loading the full milestone document."

[problem]
description = "Spec review is the #1 pain point of SDD tooling. mp specs are dense structured documents; after M82 lean model and M92 JSON persistence, agents still lack a purpose-built review read path. During the 2026-07-01 review-backlog sweep, reviewing M48 and M62 required hand-slicing JSON. raul ships dashboards (M71) but no spec-review surface; mp has validate/challenge for spec quality but not review reading. This milestone closes that gap after M93 fragment reads exist — review view delegates to mp milestone ac show / --fields projections where possible."

