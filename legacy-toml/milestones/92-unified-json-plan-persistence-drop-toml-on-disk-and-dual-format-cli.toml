[scope]
in_scope = [
    "Migration script: convert master-plan/**/*.toml → **/*.json (milestones, plan index, config, tracks, backlog, ideas, reviews, brief, decisions, annotations, sessions, archive, challenge files) with round-trip validation",
    "Apply M82 lean-spec field drops during migration (single pass: strip ceremony + convert TOML→JSON — no separate M82 file re-baseline)",
    "store.rs and all plan I/O: read/write JSON only; remove toml::from_str/to_string_pretty on plan artifacts",
    "Path resolution: milestone files become milestones/{id}-{slug}.json; update find_milestone_file, reviews spec_path, archive paths, init templates",
    "mp validate, schema enforcement, and sync_plan index against JSON files",
    "CLI format dispatch: remove TOML codec from read commands; --format raw passthrough of on-disk JSON where debug needed; graph DOT unchanged",
    "mp init / install templates: scaffold JSON plan dir",
    "Refresh tests/fixtures/projects/* and tests/scenarios/* golden output",
    "Update STORAGE.md, SPEC.md §13.7, DECISIONS.md (new ADR superseding TOML-on-disk), AGENTS.md, master-planner skill, MP-COMMANDS.md",
    "raul mp_runner: confirm no --format toml assumptions (already JSON-default per M76)",
]
out_of_scope = [
    "SQLite/Turso or any database backend (ADR-013 unchanged)",
    "Separate on-disk re-baseline before migration (M82 schema drops applied here, not in a prior tree rewrite)",
    "Allowing agents to hand-edit plan JSON files directly",
    "Human-readable mp output (raul only)",
    "Migrating non-plan config outside master-plan/ (e.g. Cargo.toml, GitHub Actions)",
]

