[milestone]
id = "92"
title = "Unified JSON plan persistence — drop TOML on-disk and dual-format CLI"
slug = "unified-json-plan-persistence-drop-toml-on-disk-and-dual-format-cli"
spec_status = "ready"
execution_status = "planned"
depends_on = ["82"]
effort = "L"
risk = "med"
change_kind = ""
priority = "high"
created = "2026-07-02"
updated = "2026-07-02"
blocked_at = ""
block_reason = ""
blocked_by = ""
target_version = "2.0.0"
executed_by = ""

[intent]
outcome = "Plan artifacts under master-plan/ are JSON on disk and JSON at the mp CLI boundary — one canonical shape, one serde path. Agents read and write through mp only (unchanged rule); stdout from mp show/list/status matches the persisted document model without TOML↔JSON conversion. Humans continue to use raul; they never need to open raw plan files. TOML is removed from the plan store, init templates, fixtures, and format-dispatch code."

[problem]
description = "Master Plan stores canonical state as TOML (milestones/*.toml, plan.toml, tracks, ideas, reviews, …) but exposes JSON to coding agents (M76 default). Every read/write pays a format boundary: load TOML → struct → JSON stdout; JSON stdin → struct → TOML write. That made sense when plan files were human-readable artifacts in git; it no longer does — humans use raul, hand-edit is forbidden, and the product is agent-first. The dual format adds store.rs complexity, --format toml debug mode, fixture drift, and two mental models for the same MilestoneFile. With JSON Schema already validating agent I/O, persisting JSON completes the design: store what you serve."

