[[design_decisions]]
area = ""
choice = "Strict guard: mp milestone update --json rejects acceptance_criteria and steps keys by default"
rationale = "Goal 2 — agents must not rebuild document arrays. Everyday planning uses fragment commands (ac/step/wp add|update|remove). Hard error prevents accidental clobber; no soft deprecation."

[[design_decisions]]
area = ""
choice = "Escape hatch: --replace-arrays on milestone update allows whole-array replacement for migration scripts and maintainer tools only"
rationale = "M82/M92 rebaseline and one-off repairs need bulk array writes. Flag is explicit and auditable; agents and skills must not use it in normal grooming/execute flows."

