[intent]
outcome = "Coding agents plan by issuing small mp verbs (show/add/update/remove on acceptance criteria, steps, and work packages) and reading small JSON slices — never assembling milestone documents, never replacing whole arrays via milestone update, never thinking about file layout. Every mutator returns only the changed fragment; every read can target one AC or one step by stable id. Goal 2 of Master Plan is explicit: remove formatting responsibility from agents; mp owns persistence after M92 JSON-canonical storage."

[problem]
description = "Master Plan already enforces the pattern (goal 1) but agents still act as document editors for goal 2. Observed agent workflows during grooming and challenge sessions: (1) mp show milestone emits the full milestone (~hundreds of lines) when the agent only needed steps or one AC; (2) removing a deferred AC (e.g. after M91 supersedes M87 AC-04) has no command — agents must mp milestone update --json with a hand-built acceptance_criteria array; (3) criterion add and step add exist, but criterion update/remove and step remove do not; (4) mutators are inconsistent — criterion add returns one AC, but milestone update returns the whole milestone; (5) agents guess JSON shape when patching arrays, causing clobbered fields and validate failures. M79 added --fields for reads; M92 unifies on-disk JSON — but neither gives id-targeted fragment writes or safe deletes. Without fragment ops, agents worry about formatting; with them, agents state intent ('remove AC-04', 'update S3 action') and mp enforces coverage and schema."

