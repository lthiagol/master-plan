[milestone]
id = "94"
title = "Bulk milestone operations — multi-target metadata writes without agent loops"
slug = "bulk-milestone-operations-multi-target-metadata-writes-without-agent-loops"
spec_status = "ready"
execution_status = "planned"
depends_on = ["82"]
effort = "M"
