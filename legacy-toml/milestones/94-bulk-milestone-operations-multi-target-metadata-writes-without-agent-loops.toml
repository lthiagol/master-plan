target_version = "2.0.0"
executed_by = ""

[intent]
outcome = "Agents change milestone metadata (priority, depends_on, spec_status, execution block/defer) across many milestones in one mp command — using --ids or the same --where filters as list milestones — instead of shell for-loops over mp milestone set-priority / update. mp runs writes sequentially, returns per-id results { succeeded, failed, results[] }, and supports --dry-run. Complements M79/M88 bulk review ops and M93 single-milestone fragment ops; closes the remaining agent loop pattern for plan metadata."

[problem]
description = "M79 and M88 eliminated jq loops and bulk review/finding writes, but milestone-level metadata still requires one subprocess per id. Observed agent pattern: for id in 82 92 93; do mp milestone set-priority $id high; done — and similar loops to add the same depends_on entry or set spec_status=review on every milestone matching a filter. Each iteration re-pays CLI startup, loses atomic reporting (which id failed?), and pushes orchestration to the shell. list milestones already supports --where and --include for bulk reads; reviews pass supports --all. Milestone writes have no symmetric bulk API. M93 deliberately scopes to single-milestone fragment ops (ac/step/wp). Cross-milestone scalar metadata updates need a first-class bulk layer."

