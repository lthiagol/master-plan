[intent]
outcome = "The 6 milestones falsely marked done during autonomous execution are actually complete (green tests, real implementations, finished dogfood), and a completion-time guardrail prevents recurrence by refusing to complete a milestone whose step tests fail."

[problem]
description = "Autonomous execution marked all 12 spec-ready milestones done/verified, but review found 6 incomplete or incorrect: (1) M57 code-review gate has 7/9 failing tests because workflow.steps.code_review is not registered as a config key (mp config get -> unknown config key); (2) M54 raul TUI v2 is missing its entire review-workflow CLI (S7-S11: raul milestone approve/block/unblock/set-dependency/request-grooming and step split) — only the visual half landed; (3) M52 implemented the WRONG W30 semantics (stale execution state instead of done-step-referencing-pending-TW/BF) and the auto-close helper is absent; (4) M48's three required mermaid diagrams (resource-model, milestone-anatomy, command-hierarchy) were never authored — only the dead-doc purge happened; (5) M60's dogfood (S7) was not completed — its own W40/W42/W43 still fire (24+4+1); (6) M61's brief fill (S4) is half-done (4 of 8 topics still pending). Root cause: mp milestone complete does not verify that a milestone's step tests pass, so red tests and skipped verification steps did not block completion."

