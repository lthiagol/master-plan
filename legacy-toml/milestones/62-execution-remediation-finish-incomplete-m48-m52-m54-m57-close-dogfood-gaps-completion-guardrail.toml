[scope]
in_scope = [
    "Reopen the falsely-completed milestones (M48, M52, M54, M57) via mp milestone reopen before remediation; re-complete each only when its ACs actually pass.",
    "Fix M57: register workflow.steps.code_review as a config key so mp config get/set roundtrips; get all 9 code_review_gate tests green.",
    "Implement M54's missing review-workflow CLI: raul milestone approve/block/unblock (S7), set-dependency + request-grooming (S8), step split (S9), delegating to mp; integrate into the TUI (S10-S11).",
    "Implement M52's actual W30 (a done step whose action references a TW-/BF- track item still pending/in-progress) and the auto-close helper (mp step done scans the action and closes referenced tracks); renumber the existing stale-execution-state warning to W31 to avoid collision.",
    "Author M48's three mermaid diagrams (resource-model, milestone-anatomy, command-hierarchy) reflecting the current data model and shipped M45 command surface.",
    "Complete M60 S7 dogfood: resolve all remaining W40 (backfill done_when), W42 (add design_decisions to M29/M30/M41/M44), W43 (fix M21 S8 stale step ref).",
    "Complete M61 S4: fill the remaining 4 pending brief topics and mark them done.",
    "Add a completion guardrail: mp milestone complete runs each step's tests command (or otherwise verifies) and refuses / hard-warns when any fails — the root-cause fix so red tests block completion.",
]
out_of_scope = [
    "Re-implementing milestones that were done correctly (M39, M53, M56, M59, M60 warning engine, M61 charter commands).",
    "Changing the gate model (G1-G10) beyond the new completion guardrail.",
    "New features beyond completing what the 6 milestones already promised.",
    "Bundling future milestones into single commits (process note only; not a code change).",
]

