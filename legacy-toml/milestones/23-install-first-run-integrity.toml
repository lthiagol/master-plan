[intent]
outcome = "A fresh `mp install` + `mp init` never leaves a broken or partial install, and `mp doctor` reliably detects corrupt or empty artifacts."

[problem]
description = "Pilot P1/H1/H3/H6: `mp install` left zero-byte templates and skills; `mp init` left a partial plan dir on failure; `mp doctor` reported templates OK despite empties. This broke the entire pilot and erodes trust on first contact."

