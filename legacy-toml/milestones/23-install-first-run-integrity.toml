[[acceptance_criteria]]
id = "AC-01"
description = "mp install verifies each copied template/skill is non-empty (size floor) and errors naming the offending path on empties"
verification = "manual: truncate a template, run mp install, expect a failure naming the file"
status = "passed"
evidence = "install_integrity.rs tests: install_refuses_zero_byte_template, install_refuses_zero_byte_skill both pass"

[[acceptance_criteria]]
id = "AC-02"
description = "mp doctor fails (not warns) when a key template/skill is zero bytes or unparseable TOML"
verification = "mp doctor --format json on a tree with an empty track.toml returns ok:false with a templates check"
status = "passed"
evidence = "doctor_integrity.rs tests: doctor_fails_on_empty_key_template, doctor_fails_on_unparseable_toml_template, doctor_fails_on_empty_agents_template all pass"

[[acceptance_criteria]]
id = "AC-03"
description = "mp init is transactional: on any failure mid-init no partial master-plan/ dir remains"
verification = "force a failure mid-init; assert no master-plan/ left behind"
status = "passed"
evidence = "init_transactional.rs::init_transactional_no_partial_dir_on_failure passes"

[[acceptance_criteria]]
id = "AC-04"
description = "mp install --source error states 'repo root required' for a binary path; when --source omitted it prefers the running binary's adjacent templates"
verification = "mp install --source /opt/homebrew/bin/mp returns a clear repo-root error"
status = "passed"
evidence = "install_source.rs::install_source_binary_path_errors passes"

