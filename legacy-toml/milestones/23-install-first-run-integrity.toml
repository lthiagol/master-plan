[[work_packages]]
id = "WP1"
name = "Integrity checks"
goal = "Make mp install/init/doctor detect and refuse corrupt/empty artifacts and never leave partial state"
rollback = ""

[[steps]]
id = "S1"
work_package = "WP1"
order = 1
action = "mp install: verify every copied template/skill is non-empty above a size floor; error names the offending path"
files = [
    "crates/mp/src/install.rs",
    "crates/mp/src/assets.rs",
]
tests = "cargo test -p mp"
done_when = "mp install refuses zero-byte or under-floor copied artifacts with a path-naming error"
status = "done"
covers_ac = ["AC-01"]
depends_on_steps = []

[[steps]]
id = "S2"
work_package = "WP1"
order = 2
action = "mp doctor hard-fails (ok:false) when a key template/skill is zero bytes or unparseable TOML, naming the check"
files = ["crates/mp/src/doctor.rs"]
tests = "crates/mp/tests/doctor_integrity.rs: empty track.toml tree -> mp doctor --format json returns ok:false with a templates check"
done_when = "doctor returns ok:false on empty/unparseable key templates"
status = "done"
covers_ac = ["AC-02"]
depends_on_steps = []

[[steps]]
id = "S3"
work_package = "WP1"
order = 3
action = "Make mp init transactional: stage master-plan/ in a temp dir and atomically move into place; on any mid-init failure no partial master-plan/ remains"
files = [
    "crates/mp/src/bootstrap.rs",
    "crates/mp/src/install.rs",
]
tests = "crates/mp/tests/init_transactional.rs: force a failure mid-init; assert no master-plan/ left behind"
done_when = "forced mid-init failure leaves no partial master-plan/ directory"
status = "done"
covers_ac = ["AC-03"]
depends_on_steps = []

[[steps]]
id = "S4"
work_package = "WP1"
order = 4
action = "mp install: when --source points at a binary path, error 'repo root required'; when --source is omitted, prefer the running binary's adjacent templates"
files = ["crates/mp/src/install.rs"]
tests = "crates/mp/tests/install_source.rs: mp install --source $(which mp) returns a clear repo-root error; default resolves adjacent templates"
done_when = "binary --source yields repo-root error; omitted --source resolves adjacent templates"
status = "done"
covers_ac = ["AC-04"]
depends_on_steps = []

[[steps]]
id = "S5"
work_package = "WP1"
order = 5
action = "mp install: verify copied TOML templates are parseable (valid structure); error names the offending path"
files = [
    "crates/mp/src/install.rs",
    "crates/mp/src/assets.rs",
]
tests = "cargo test -p mp"
done_when = "mp install refuses unparseable copied templates with a path-naming error"
status = "done"
covers_ac = ["AC-01"]
depends_on_steps = []

