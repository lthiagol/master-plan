[scope]
in_scope = [
    "make install-global: copy both mp and raul release binaries to ~/.agents/master-plan/bin/",
    "Fix resolve_raul_binary for non-dev mp install: resolve from current_exe sibling, workspace build artifact, or explicit error — never silent skip",
    "mp install: fail loudly or build raul when missing; add integration test asserting bin/raul exists after install",
    "mp doctor: add runtime discoverability checks — mp on PATH (or MP_HOME/bin/mp exists), raul binary present in MP_HOME/bin when install layout expected; surface in JSON as checks[] with remediation hint (path_snippet)",
    "Align INSTALL.md layout diagram and quick-start to show both binaries; note agent shells may need PATH export",
    "Uninstall: verify raul removal (already coded; add test if missing)",
]
out_of_scope = [
    "Homebrew formula bundling raul (separate dist track)",
    "Auto-writing ~/.zshrc or Cursor cli-config.json (document manual setup; optional follow-up for harness env hook)",
    "cargo install raul as separate package",
]

