[intent]
outcome = "After make install OR mp install, both mp and raul land in ~/.agents/master-plan/bin/. mp doctor warns when binaries are not discoverable on PATH in the current environment. Install paths (make vs mp) are aligned so contributors and users get the same artifact set."

[problem]
description = "Independent code review found install/distribution gaps that block human PM workflows and agent adoption. ~/.agents/master-plan/bin/ contains only mp — raul is missing despite M40/M41 shipping it as the human-facing CLI. Root causes: make install-global copies only mp (TARGET_RAUL unused); mp install's resolve_raul_binary() looks at install_dir/bin/raul on non-dev installs (doesn't exist on first install) and silently skips raul via if let Ok; docs layout shows only bin/mp. Separately, agent shells (Cursor) often lack PATH to mp even after make install — doctor checks embedded assets and harness skills but NOT whether mp/raul resolve on PATH or MP_HOME is set. This was observed in a live review session where mp was not found until full path was used."

