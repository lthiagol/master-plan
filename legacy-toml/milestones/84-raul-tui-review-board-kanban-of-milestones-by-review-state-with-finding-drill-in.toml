[[findings]]
id = "F-01"
severity = "high"
category = "correctness"
description = "Board broken against installed mp (v2.0.0-rc.2): list_milestones_with_findings uses --include findings and reviews_lifecycle uses 'reviews lifecycle' — neither exists in installed release. load_board silently swallows lifecycle failure via .ok(), so Pending Review column is always empty on the shipped product. AC-04 only verified against unreleased mp."
status = "fixed"
author = ""
fixed_in = "da9dea9"
created = "2026-07-01"
resolved = "2026-07-02"

[[findings]]
id = "F-02"
severity = "high"
category = "correctness"
description = "Classification drops milestones in spec_status=review (M80/M81/M82 currently) and planned-without-ready via '_ => continue'. For a review board, the awaiting-approval queue vanishes silently. No logging."
status = "fixed"
author = ""
fixed_in = "da9dea9"
created = "2026-07-01"
resolved = "2026-07-02"

