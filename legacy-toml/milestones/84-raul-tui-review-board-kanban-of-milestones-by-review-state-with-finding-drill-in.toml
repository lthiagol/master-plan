[intent]
outcome = "raul has a separate TUI view (a board, toggled from the lane screen) showing every milestone as a card grouped into columns by review_state (Ready, Executing, Pending Review, Open Findings, Remediated, Verified). A maintainer sees whole-project review-cycle health at a glance: what's done-but-unreviewed, what has open findings, what's remediated. Drill-in on a card opens the milestone detail + its findings thread (open findings highlighted). State changes still flow through mp commands (no in-board editing)."

[problem]
description = "raul's TUI lanes (M77) are per-milestone-depth: great for inspecting one milestone, blind to cross-project review-cycle health. After M77/M78/M79 the reviewer/maintainer cannot see, in one place, which milestones are executed-but-unreviewed, which carry open findings, or which are remediated — that state lives in mp (made observable by M83) but has no raul visualization. This milestone adds a Kanban-style board view that consumes M83's review_state + findings and renders the whole cycle. It is an additive view (the existing lane screen stays); movement between columns is driven by mp state changes, not drag-and-drop."

