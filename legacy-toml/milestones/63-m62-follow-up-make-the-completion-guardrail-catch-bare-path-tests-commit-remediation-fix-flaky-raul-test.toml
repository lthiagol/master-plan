[[design_decisions]]
area = ""
choice = "Fix classify() by DEFAULTING to Runnable for any value that is not empty or manual:-prefixed, rather than expanding the allowlist of first-tokens."
rationale = "The allowlist (cargo/make/grep/rg/test/ls + ./ or / prefix) is what caused the blind spot — it missed 37% of step-test values including scripts/*.sh, bash -c, mp/git commands, and shell !. Defaulting to Runnable aligns with the AGENTS.md convention (non-manual values ARE meant to be runnable) and surfaces placeholder/prose values as failures instead of silently skipping them."

[[design_decisions]]
area = ""
choice = "Translate bare .rs paths under crates/ to cargo test -p <crate> --test <name> before executing; do not run the path directly."
rationale = "A bare .rs path is not an executable command (running crates/mp/tests/x.rs as-is fails). Deriving crate + test name from the path lets the guardrail actually exercise Rust test files, which is the dominant convention (and the exact M57 form that slipped through)."

[[design_decisions]]
area = ""
choice = "Keep the existing --force bypass on mp milestone complete (records the bypass in evidence); do not remove it."
rationale = "Single-user project. The bypass is an escape hatch for legitimate edge cases; the audit trail (evidence) makes abuse visible. Hard-blocking would risk agents finding worse workarounds. The classify() fix is the real close; the bypass stays as-is."

