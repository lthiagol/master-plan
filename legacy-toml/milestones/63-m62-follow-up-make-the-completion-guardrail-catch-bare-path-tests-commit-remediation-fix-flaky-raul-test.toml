[scope]
in_scope = [
    "Fix classify() COMPREHENSIVELY: default to Runnable for any value that isn't 'manual:' or empty (so bash -c, scripts/*.sh, mp/git commands, and shell loops are all executed), and translate bare .rs paths under crates/ to cargo test invocations (derive crate + test name: crates/mp/tests/x.rs -> cargo test -p mp --test x). Today 154/412 step-test values (37%) are misclassified as Manual and skipped — not just .rs paths but also scripts/audit-step-tests.sh (6x), mp (5x), git, and shell !.",
    "Add a regression test proving the guardrail now blocks completion when a step test fails — both a bare-path .rs test AND a non-.rs command form (the exact M57 scenario that slipped through, plus the broader coverage).",
    "Commit all currently-uncommitted M62 remediation work, one commit per remediated milestone (M48/M52/M54/M57), per the handoff. (Largely satisfied by commit f0797e9 — verify and mark done.)",
    "Fix the raul_backlog_list_runs flakiness (test isolation — likely shared cwd/state leaking between tests); it must pass deterministically across repeated full-suite runs.",
    "Update the AGENTS.md step-testing convention to state what the guardrail runs: non-manual values run as-is, bare .rs paths run via cargo test, manual:/empty are skipped. Note that placeholder/prose values will now surface as failures (correct behavior — they violate the single-path-or-command convention).",
]
out_of_scope = [
    "Re-doing the remediation code (M57/M54/M52 are correctly implemented; only the guardrail's coverage and hygiene are in scope).",
    "Adding new product features.",
]

