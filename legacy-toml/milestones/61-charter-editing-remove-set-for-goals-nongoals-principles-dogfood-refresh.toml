target_version = "2.0.0-rc.1"

[intent]
outcome = "The charter is fully editable through mp — append, remove, and replace (set) for goals, non-goals, and principles — so stale goals can be retired without a forbidden hand-edit of plan.toml, and this repo's rotted charter gets refreshed to the v2.0 direction."

[problem]
description = "mp plan goals / nongoals / principles are append-only: they expose `add` but no `remove` or `set` (replace). mp plan set covers project metadata (target_version, planning-status, stack) but NOT the goal collections. So there is no toolkit way to retire a stale goal — this repo's charter still lists 'Ship v0.3' and a v1 adoption goal while the project is on v2.0+ work (mp=agent, raul=human, CLI grouping redesign), and target_version reads 1.2. Correcting it requires a hand-edit of plan.toml, which is forbidden in the plan zone. Note: the brief is NOT a tooling gap — mp brief edit <id> --body --status already supports non-interactive edits; the brief topics are simply unfilled (a content gap this milestone dogfoods)."

