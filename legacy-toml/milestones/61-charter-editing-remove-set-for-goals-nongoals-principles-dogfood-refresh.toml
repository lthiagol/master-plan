[scope]
in_scope = [
    "Add `mp plan goals remove <text|index>` and `mp plan goals set --json @-` (replace the whole list). Mirror for `mp plan nongoals` and `mp plan principles`.",
    "`remove` matches by exact text or by index (as shown by mp plan show); a no-match returns a clear error, not a silent no-op.",
    "`set --json @-` replaces the entire collection in one write — enables bulk correction of stale goals.",
    "Dogfood charter: remove the stale v0.3/v1 goals, add v2.0-direction goals (agent-only mp + human raul surface, CLI grouping redesign, grooming discipline), set target_version to the current line.",
    "Dogfood brief: fill the empty brief topics (problem, audience, capabilities, success) via the existing mp brief edit.",
]
out_of_scope = [
    "Changing the charter interview flow (mp interview checklist --checklist-type charter stays as the interactive path).",
    "Versioning or history of charter changes.",
    "New charter fields beyond goals/nongoals/principles and the metadata mp plan set already handles.",
    "A TUI/editor for the charter (CLI only).",
    "New brief commands (mp brief edit already suffices; this milestone only fills content).",
]

