[intent]
outcome = "A /spec-grill skill that drives a vague idea to a review-ready milestone spec through adversarial multi-round questioning, activated via slash command or contextual agent detection."

[problem]
description = "Today mp interview checklist --draft produces a one-shot checklist and mp interview gaps surfaces gaps, but there is no adversarial multi-round flow. The agent accepts vague intent, weak ACs, and missing out-of-scope, leading to milestones needing rework at review. The original grill-me approach exists but isn adapted to the mp flow. This skill wraps mp interview checklist/gaps and mp milestone create into an adversarial loop, activated by /spec-grill or when the agent detects a vague idea."

