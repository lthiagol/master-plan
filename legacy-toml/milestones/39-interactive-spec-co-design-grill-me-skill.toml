    "Design the grilling flow: multi-round adversarial questioning (intent -> scope -> ACs -> out-of-scope -> risks)",
    "Activation via /spec-grill slash command OR contextual detection when the agent sees a vague idea",
    "Each round runs mp interview gaps to surface remaining weak spots",
    "Final output: a validated milestone spec ready for mp milestone create",
    "Validate the skill demonstrably raises a vague idea to a review-ready milestone spec",
]
out_of_scope = [
    "Any new Rust code or mp CLI command (pure skill/instruction file)",
    "Skill deployment via install plumbing (owned by M51)",
    "Replacing mp interview (this wraps/extends it)",
    "New persistence formats (reuse mp writes)",
    "Automated spec generation (the human is grilled, not bypassed)",
    "Grilling beyond milestone specs (tracks/backlog/ideas out of scope)",
]

