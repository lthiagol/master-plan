[milestone]
id = "41"
title = "Simplify mp to agent-only (move human surface to raul)"
slug = "simplify-mp-to-agent-only-move-human-surface-to-raul"
spec_status = "verified"
execution_status = "done"
depends_on = ["40"]
effort = "M"
risk = "medium"
change_kind = ""
priority = "normal"
created = "2026-06-27"
updated = "2026-06-30"
blocked_at = ""
block_reason = ""
blocked_by = ""
target_version = "2.0.0-rc.1"

[intent]
outcome = "mp becomes a focused, agent-only CLI whose sole first-class output is --format json (plus --format raw for TOML debugging); every human-facing display mode is REMOVED (not just deprecated) and replaced by raul equivalents — so each tool is optimized for its audience. Agents that previously displayed to users via mp --format human now summarize JSON or defer to raul. Pairs with M38 v2.0 grouping as one coordinated breaking change."

[problem]
description = "mp carries both agent output (--format json, the stable API frozen by D-011) and human output (--format human/markdown/pr-body, mp digest, mp graph human modes, render.rs). Serving both audiences in one binary dilutes each. Now that raul (M40) covers the human review surface, mp hard-removes its human-focused output and doubles down on agent optimization: stable JSON, terse confirmations, scriptable defaults. This is a breaking change coordinated with M38 v2.0 grouping. Sequenced M40 -> M41 -> M38."

