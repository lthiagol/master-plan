    "Migrate consumers BEFORE removal: master-planner SKILL.md + AGENTS.md route humans to raul and tell agents to summarize JSON or defer to raul (no more mp --format human for user display); MP-COMMANDS.md updated; golden scenarios + integration tests purged of human/markdown/pr-body snapshots (json kept).",
    "HARD-REMOVE the dropped surfaces: drop human/markdown/pr-body from the cli.rs format enum + all dispatch paths; delete render.rs, digest.rs, export.rs; reduce graph.rs to json-only; remove dead call sites in app.rs/commands.",
    "Tighten mp agent ergonomics: json-first defaults, terse confirmations, remove human-rendering code paths.",
