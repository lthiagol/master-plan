[intent]
outcome = "mp CLI internals are modular, DRY, and testable: app.rs god-module split into per-resource command modules, duplication removed via shared helpers and a TomlResource trait, render layer covers all entity kinds, typed ids eliminate normalization bugs."

[problem]
description = "app.rs is a 1936-line god-module mixing command dispatch, ~30 handlers, track CRUD, archive logic, and presentation glue. track.rs holds only track_promote while the other 6 track ops live in app.rs. TOML load/write boilerplate is duplicated ~25x in store.rs. ID-generation loops are duplicated 10x. The milestone load->mutate->stamp->save pattern is duplicated 12x. The literal ['bugfix','tweak'] is hardcoded in 11 sites with no TrackKind enum. Test harness (repo_root/mp/run_mp) is copy-pasted across 18 test files (~600 duplicate lines). render.rs only covers 2 of ~12 entity kinds; the rest hand-roll markdown."

