[scope]
in_scope = [
    "Sidebar shell: left sidebar of tabbed lanes (Status, Milestones, Path, Bugfixes, Tweaks, Backlog, Inbox) and a right content pane; selecting a lane renders its list in the content pane",
    "Tabbed lanes split tracks by kind: Bugfixes (kind=bugfix) and Tweaks (kind=tweak), derived from the existing mp list tracks read path via filtering",
    "Keyboard tab navigation (e.g. Up/Down within the sidebar, plus direct selection by number or first-letter) and mouse-click tab selection",
    "Drill-in within each lane: Enter on a list item opens its detail (MilestoneDetail, TrackDetail for bugfix/tweak, BacklogDetail) in the content pane; back/Esc returns to the list; no dead-ends",
    "Fix ReviewMenu: the review action menu (Approve/Block/Unblock/Request-grooming) opens over the milestone detail, navigates with Up/Down, executes the selected action on Enter, cancels on Esc",
    "Responsive layout: below a width threshold the sidebar collapses to an icons-only strip (plain single-glyph labels for this milestone; full themed icons are M54); tabs remain selectable and clickable; above the threshold full labels show",
    "Resizable sidebar: width adjustable by dragging the gutter with the mouse and/or by keyboard (e.g. [ / ])",
    "Mouse support throughout: click a tab to select, click a list item to select/drill, drag the gutter to resize",
    "Actionable Path and Inbox lanes: in Path, Enter on the suggested Next action opens that milestone's detail; in Inbox, Enter on an item deep-links to its context (milestone detail or track item)",
    "Scrollable content/detail: Up/Down adjust scroll so long milestones/items are fully viewable",
    "Resolve the legacy key collisions under the new model (m/a/f/R no longer ambiguous in the sidebar shell)",
]
out_of_scope = [
    "Theme / color / icon visual styling (rebaselined M54); this milestone uses plain glyphs for the collapsed icon strip only",
    "Terminal-width-aware table rendering for the CLI table output (rebaselined M54)",
    "Ideas lane: requires wiring a new mp idea list read path into raul; deferred to a follow-up track/milestone",
    "The raul design-decision command (separate future work)",
    "Any new raul CLI subcommand beyond what already exists",
]

