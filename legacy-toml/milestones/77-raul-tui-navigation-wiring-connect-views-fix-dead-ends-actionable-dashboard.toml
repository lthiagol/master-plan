[intent]
outcome = "raul's TUI is rebuilt around a persistent left sidebar of tabbed lanes (Status, Milestones, Path, Bugfixes, Tweaks, Backlog, Inbox) with the selected lane's list and detail shown in a right content pane. Navigation is flat (no fragile view stack), every lane drill-ins to a detail with no dead-ends, the layout is responsive (sidebar collapses to icons on narrow terminals), and both keyboard and mouse work for tab switching, item selection, drill-in, and sidebar resize. A human can reach any plan surface in one click or keystroke."

[problem]
description = "The current TUI is built on a push/pop view stack with a fixed 2x2 dashboard. This leaves views disconnected: only one chain works end-to-end (Dashboard -> Milestones -> Detail -> Annotations -> CoApproval); TracksList and BacklogList are dead-ends with no drill-in; the ReviewMenu is unreachable (open_review_menu sets an orphan flag, never the view); the dashboard inbox and suggested path are display-only; MilestoneDetail hardcodes scroll(0,0) and truncates; and m/a/f/R keys collide across contexts. Rather than weld these together per-view, we replace the shell: a sidebar of lanes plus a content pane gives flat, always-available navigation, makes dead-ends structurally impossible, and lets every list drill into a detail uniformly. Responsive layout and mouse support bring raul up to the standard of modern TUIs (lazygit/k9s)."

