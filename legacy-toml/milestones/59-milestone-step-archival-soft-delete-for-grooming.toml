[scope]
in_scope = [
    "Wire CLI: mp milestone archive <id>, mp milestone restore <id>, mp milestone purge <id> against the existing store.rs functions (archive_milestone / restore_archived_milestone / purge_archived_milestone).",
    "Fix index consistency: archive/restore must call sync_plan so the plan.toml milestones index drops the archived milestone and re-adds it on restore (archive_milestone currently does not do this).",
    "Step archival: add mp milestone step archive <m> <s> and restore <m> <s>, mirroring the milestone archive model (e.g. archive/steps/ or an archived flag within the milestone file).",
    "mp list milestones excludes archived by default; add a --include-archived flag. mp list archived --entity-type milestone surfaces milestone entries.",
    "mp list steps excludes archived steps by default; add --include-archived.",
    "Read-path exclusion: mp validate, mp path, mp next-step, and mp status skip archived milestones/steps so they neither block nor pollute the active view.",
    "mp show milestone <archived-id> still resolves and displays the milestone from the archive dir (history preserved).",
    "Docs + AGENTS.md: document archive/restore as the soft-delete step in the grooming workflow, replacing delete.",
]
out_of_scope = [
    "Retroactive recovery of already-hard-deleted milestones (e.g. M55) — single-user project, no retrocompat needed.",
    "Archiving non-milestone/step entities (tracks and ideas already have archive).",
    "Time-based or automatic archival.",
    "Audit trail of who archived (single user).",
]

