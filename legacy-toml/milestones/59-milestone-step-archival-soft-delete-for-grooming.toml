[intent]
outcome = "Grooming can retire a milestone or step via archive instead of hard delete: archived items are hidden from active listings, validate, path, and next-step, but remain queryable for history and restorable. Replaces the lossy delete flow used during restructures."

[problem]
description = "Two soft-delete gaps. (1) Milestones can only be hard-deleted (mp milestone delete) — no way to retire one while preserving its history. The storage layer already exists (crates/mp/src/store.rs:580 archive_milestone, :602 restore_archived_milestone, :623 purge_archived_milestone, :637 list_archived_milestones, :650 archived_milestone_path) but is NOT wired to any CLI command, and archive_milestone does NOT sync the plan.toml milestones index (it only moves the file + appends archive meta), so the index would go stale. (2) Steps have no archival at all — only add/update/split — which forced repurposing steps instead of removing them during the M51/M52 restructure. Single-user project, so no retrocompat or migration of already-deleted items is needed."

