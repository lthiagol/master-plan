[intent]
outcome = "An interactive TUI for raul (raul --tui / raul -i) where humans browse milestones, drill into a milestone detail (steps + ACs), read and act on annotations (review-requests, break-downs, change-suggestions), create annotations, and request/resolve approvals — delegating every write to mp annotation / mp milestone approve. Consumes the annotation system (M43). The TUI shares raul MpRunner/read layer with CLI mode; app-state is pure and unit-tested, key renders snapshot-tested, full UX manually walked through."

[problem]
description = "raul CLI (M40) is good for quick queries but poor for a review session: browsing a milestone, reading its steps, checking open annotations, approving, and moving on is clunky as separate commands. A TUI gives humans a single navigable surface for the view/review/approve loop. The annotation system (M43) provides the data model and mp commands; the TUI only renders and delegates writes. raul never writes plan files — it shells out to mp for every annotation create/resolve and milestone approve. mp enforces the G14 approval gate; raul shows its status and delegates the resolving action."

