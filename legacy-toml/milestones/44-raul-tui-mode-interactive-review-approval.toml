[scope]
in_scope = [
    "raul --tui / raul -i flag enters interactive mode (final flag name confirmed in spec interview)",
    "TUI built with ratatui + crossterm (additive deps on raul only; never leak into mp)",
    "Minimal review loop views: milestone list -> milestone detail (steps + ACs + status) -> annotation thread per entity. Dedicated document viewer deferred (the detail view shows the spec).",
    "Annotation actions: list/read annotations on an entity (via mp annotation list/show --format json), create an annotation (prompt -> delegate to mp annotation create), resolve/reopen (delegate to mp annotation resolve/reopen). raul writes nothing directly.",
    "Approval action: create/resolve an approval-request annotation via mp annotation; show G14 gate status (blocked vs unblocked) read from mp validate/status. mp enforces G14; raul delegates and displays.",
    "Shared read layer: extract typed read helpers over MpRunner consumed by BOTH CLI commands and TUI (no duplicated mp-shellout logic).",
    "Pure app-state module (view enum, navigation stack, selection, filter state, transitions) separated from rendering — fully unit-tested.",
    "Navigation: drill-down, back, filter open annotations, jump between entities; help/cheatsheet in-app; graceful exit + terminal teardown (raw mode restored on panic).",
]
out_of_scope = [
    "The annotation data model and mp commands (that is M43) — TUI only consumes them via JSON",
    "Editing canonical plan docs directly from the TUI (still delegated to mp)",
    "A GUI or web surface",
    "A dedicated document viewer pane (deferred; detail view shows the spec)",
    "Full input-harness integration tests (hybrid testing chosen: state unit-tested + render snapshots + manual walkthrough)",
    "raul enforcing gates directly (G14 lives in mp; raul only displays status and delegates the resolving action)",
]

