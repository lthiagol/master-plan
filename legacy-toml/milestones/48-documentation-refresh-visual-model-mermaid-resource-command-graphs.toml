[scope]
in_scope = [
    "Fix broken doc references in root AGENTS.md (and master-plan/AGENTS.md, README) to point at the docs/concepts/0X... locations; audit every internal doc link so none are stale.",
    "Purge dead documentation: delete the docs/mp/** per-command stubs (37 stubs; the install tests they break were already fixed in M47), the SUPERSEDED instructions.md, and the v1.1-era NEXT-STEPS.md.",
    "Make the human-vs-agent doc split explicit: add/refresh a router (docs/concepts/00-Concepts.md or README) that routes humans to concepts + the raul walkthrough + ADOPTION/INSTALL, and agents to AGENTS.md + master-planner SKILL + AGENT-PLAYBOOK/READINESS + ARCHITECTURE.",
    "Add a mermaid resource-model diagram: a Master Plan project and its artifacts (brief, charter, milestones, backlog, ideas, tracks, decisions, annotations, sessions, releases, changelog) with containment and cross-references (e.g. annotation targets a milestone; approval-request gates a milestone via G14).",
    "Add a mermaid milestone-anatomy diagram: spec (intent/problem/scope/acceptance_criteria) -> work packages -> steps (depends_on_steps, covers_ac, tests) + the gate matrix (G1-G10, G14) + linked decisions.",
    "Add a mermaid command-hierarchy tree (Docker-style) reflecting the actual shipped M45 surface: mp object groups (milestone, track, specs, plan) with their subcommands plus the top-level lifecycle verbs (init, validate, sync, status, next, path, execution, git, doctor), and the raul command surface.",
    "Verify docs/concepts/06 Reference/MP-COMMANDS.md reflects the M45 regrouped command surface (mp milestone groom/challenge/step/wp, mp track archive/restore/purge, --format json|toml; no stale next-step or --format raw references).",
    "Refresh ARCHITECTURE.md if the codebase map drifted (annotation.rs added in M43, raul TUI in M44, render.rs/export.rs deleted in M41).",
    "Document RAUL backronym (Review, Approval, Unblock Loop) in raul docs and mermaid command-hierarchy diagram",
]
out_of_scope = [
    "Rewriting master-planner SKILL.md content beyond path/link fixes (the agent skill is maintained separately).",
    "The raul tracks/backlog command surface (that is ID-04, a separate idea).",
    "New product features or behavior changes.",
    "A full docs/concepts/** prose rewrite - this milestone fixes links, splits audiences, purges dead docs, and adds diagrams; deep prose edits are ongoing.",
    "The post-M51 install command surface (mp install --harness, --print-paths, agent profiles) — documented when M51 lands; M48 command diagrams intentionally reflect only the shipped M45 surface.",
]

