[intent]
outcome = "Accurate, visually-modeled documentation for mp and raul with an explicit human-vs-agent split: broken links fixed, the dead docs/mp stub graveyard and stale root files purged, a router that sends each audience to the right entry, and mermaid diagrams (resource model, milestone anatomy, command hierarchy) that make the system legible at a glance."

[problem]
description = "Documentation has rotted against the v2.0 architecture and the docs reorg. (1) Root AGENTS.md references docs/AGENT-READINESS.md, docs/MP-COMMANDS.md, and docs/SPEC.md - ALL THREE PATHS ARE BROKEN; the files moved to docs/concepts/01..., /06..., /03... during the concepts-folder reorg, so the repo entry point for agents has dead links. (2) docs/mp/** is a graveyard of 40 per-command README stubs, 37 of which are under 200 bytes (leftover human command docs from before M41 made mp agent-only); the 10-byte stubs actively break install_integrity/install_source/p6/p7 tests (shared with M47 WP1). (3) instructions.md is self-marked SUPERSEDED and its own pointer (docs/AGENT-PLAYBOOK.md) is a moved path; NEXT-STEPS.md is v1.1-era while the repo is v2.0. (4) The M41 agent/human tool split (mp emits JSON for agents, raul is the human surface) is not reflected in doc organization - docs/concepts/** mixes both audiences with no routing. (5) There is no visual model: the resource relationships (a Master Plan project = brief/charter/milestones + the collections backlog/ideas/tracks/decisions/annotations + sessions + releases; a milestone = spec/WPs/steps/gates/decisions) and the M45 Docker-style command hierarchy (mp milestone groom/challenge/step/wp, mp track archive/restore/purge, mp specs delta, mp plan metrics) exist only as prose. Mermaid is used in exactly one file today."

