[scope]
in_scope = [
    "mp milestone dependents <id> --format json: returns every milestone whose depends_on includes <id> (reverse deps).",
    "mp milestone deps <id> --format json: returns what <id> depends on (forward, for symmetry/completeness).",
    "mp milestone impact <id> --format json: transitive blast radius = recursive reverse deps + any path pins involving <id> + path implications (what falls after/before <id> in the current path).",
    "mp path list-pins --milestone <id> filter: scope pin listing to a single milestone.",
    "Warn (not block) on mp milestone create / mp milestone update when a depends_on entry references a non-existent milestone id - catches the silent M45/M46 depends_on drop class of bug.",
    "raul explain impact <id>: human-readable blast-radius view over the mp impact json, wired through the shared reads layer.",
    "Golden scenario + integration tests covering reverse deps, transitive impact, pin scoping, and the dangling-depends_on warning.",
]
out_of_scope = [
    "Changing the dependency model or the path engine itself (this milestone adds a query/reading dimension over the existing graph).",
    "Auto-repair of broken depends_on entries (warn only; repair is a human/agent action).",
    "A TUI view (CLI first; TUI is a later pass).",
    "Impact analysis across archived milestones (operates on the active plan only).",
]

