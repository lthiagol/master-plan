[intent]
outcome = "Agents and humans can answer dependency questions natively via mp: 'what depends on M39?' (dependents), 'what does M39 depend on?' (deps), and 'what is the blast radius if I block/delete/reorder M39?' (impact) - all as stable --format json, plus a raul explain view - so planning decisions are self-service instead of ad-hoc scripts over mp show JSON."

[problem]
description = "mp has a forward dependency graph (crates/mp/src/graph.rs, mp graph, path_engine.rs) but no native REVERSE or TRANSITIVE query dimension. During M39 planning, answering 'does anything depend on M39?' required looping mp show milestone over every planned milestone and inspecting depends_on by hand; 'do any path pins reference M39?' needed mp path list-pins plus a manual filter; 'what is affected if I block/delete/reorder this?' was not answerable at all without hand-parsing JSON. This forced external scripts (the same anti-pattern as ID-04: agent reshaping mp JSON externally) and made block/delete/reorder decisions guesswork. A silent depends_on drop was also observed during mp milestone create on M45/M46 - there is no warning when a depends_on entry references a non-existent milestone."

