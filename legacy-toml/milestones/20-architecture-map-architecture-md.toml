[[steps]]
id = "S6"
work_package = "WP1"
order = 6
action = "Write ARCHITECTURE.md section 6 (Entry-point recipes) - the highest-leverage section for unsupervised work. Cover 5 recipes with exact file paths and the pattern to follow: (1) Add a new CLI command: edit cli.rs (clap enum), create commands/<name>.rs (handler delegating to domain module), wire in app.rs dispatch, add tests/<feature>.rs. (2) Add a new TOML resource: define type in model.rs, impl TomlResource trait in store.rs, add load/save generics, add cli command. (3) Add a validation gate: add rule to validate.rs, reference in the relevant gate function (validate_milestone_review/ready/etc). (4) Add an entity renderer: add render_<entity> to render.rs, delegate from commands/show.rs. (5) Add a scenario test: add tests/scenarios/<name>.toml manifest, scenarios_runner picks it up."
files = ["ARCHITECTURE.md"]
tests = "cargo test -p mp"
done_when = "Section 6 has 5 recipes each with exact file paths and the pattern; recipes cover add CLI command, add TOML resource, add validation gate, add entity renderer, add scenario test"
status = "done"
covers_ac = ["AC-06"]
depends_on_steps = []

