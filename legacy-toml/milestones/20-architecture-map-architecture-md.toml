order = 3
action = "Write ARCHITECTURE.md section 3 (Key types): PlanContext (paths.rs), MilestoneFile + Intent/Problem/Scope/Step/WorkPackage/AcceptanceCriterion sub-structs (model.rs), TrackKind enum, MilestoneId newtype, TomlResource trait, ValidationIssue. One-line per type with file location."
files = ["ARCHITECTURE.md"]
tests = "cargo test -p mp"
done_when = "Section 3 lists all 6 key types with one-line descriptions and file locations"
status = "done"
covers_ac = ["AC-02"]
