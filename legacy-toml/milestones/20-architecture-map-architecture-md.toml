work_package = "WP1"
order = 1
action = "Write ARCHITECTURE.md section 1 (Module map) at repo root: enumerate every crates/mp/src/*.rs and crates/mp/src/commands/*.rs with a one-line description of its responsibility. Match the post-M17 structure. Group by concern (entry, dispatch, commands, domain, engine, persistence, view, shared, support)."
