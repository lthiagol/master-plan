[[steps]]
id = "S2"
work_package = "WP1"
order = 2
action = "Write ARCHITECTURE.md section 2 (Layering): ASCII diagram showing main.rs -> cli.rs (parse) -> app.rs (dispatch) -> commands/* (handlers) -> domain modules -> store.rs (TOML) -> schema.rs (enforcement); render.rs as view layer; paths.rs/track_kind.rs/MilestoneId as shared types. Note the rule that app.rs must stay thin (<=400 lines per M17 AC)."
files = ["ARCHITECTURE.md"]
tests = "cargo test -p mp"
done_when = "Section 2 has the layering diagram and the app.rs-thin rule"
status = "done"
covers_ac = ["AC-02"]
depends_on_steps = []

[[steps]]
