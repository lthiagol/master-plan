[intent]
outcome = "Agents and humans can orient in the mp codebase in seconds via a single root-level ARCHITECTURE.md instead of spawning explore agents and reading 10+ files per session."

[problem]
description = "The first action of any coding session on this repo is expensive code exploration: 46 src modules, 19 test files, 12.6k LOC, no single doc mapping the structure. Every agent re-derives the same mental model (module responsibilities, layering main->cli->app->commands->domain->store->schema, persistence model, ID conventions, test harness, entry-point recipes for common tasks like 'add a new command' or 'add a new TOML resource'). This is repeatable overhead that a curated architecture doc eliminates."

