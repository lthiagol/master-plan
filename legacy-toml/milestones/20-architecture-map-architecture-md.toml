order = 5
action = "Write ARCHITECTURE.md section 5 (Test structure): integration tests in tests/ shell out to compiled binary via tests/common/mod.rs TestEnv (set MP_HOME=repo_root, run(args)->Output, run_json); scenario runner via tests/scenarios_runner.rs walks tests/scenarios/; inline unit tests rare (only in model.rs/path_engine.rs/schema.rs/step.rs). Note cargo test -p mp + make adopt-check + make test-fixtures as the test commands."
files = ["ARCHITECTURE.md"]
tests = "cargo test -p mp"
done_when = "Section 5 covers TestEnv, scenario runner, unit test locations, the 3 test commands"
status = "done"
