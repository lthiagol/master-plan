[intent]
outcome = "Projects can opt into a mandatory code review step: when workflow.steps.code_review = true, a milestone cannot complete until its review step is done, and mp milestone list-pending-review shows milestones waiting for review."

[problem]
description = "There is no implementation-stage review gate. mp milestone complete fires as soon as ACs pass, so a human reviewer has no enforced checkpoint between 'implemented' and 'done'. Note: the annotation system (M43) already provides SPEC-stage review via review-request and approval-request annotations (gated by G14, resolved through raul approval approve). This milestone adds the IMPLEMENTATION-stage complement: a post-AC, pre-complete code review gate. They are complementary — annotations review the plan, code_review reviews the implementation — not redundant."

