    "Add workflow.steps.code_review = true|false to ProjectConfig (default false)",
    "When code_review is enabled, mp milestone complete checks that a review step exists and is done before allowing completion (a new gate, alongside G6/G7)",
    "mp milestone list-pending-review: lists milestones that are implemented but waiting for code review",
    "Positioning: workflow.steps.code_review is implementation-stage review (after ACs pass, before complete). Spec-stage review uses the M43 annotation system (review-request / approval-request). The two are complementary, not overlapping.",
    "AGENTS.md / docs update documenting the optional review step, the new gate, and how it relates to annotation-based approval",
]
out_of_scope = [
    "Auto-assigning reviewers or integration with code-review tooling (GH PRs, etc.)",
    "Changing default milestone flow (code_review defaults to false; opt-in only)",
    "Spec-stage review — that is the M43 annotation system (review-request / approval-request); this milestone is implementation-stage only",
    "raul TUI surface for review actions (that is M54)",
    "The install/distribution work (M51)",
]

