[scope]
in_scope = [
    "Approval flow: formalize the agent-requests-via-mp / human-approves-via-raul loop on top of M43 approval-request annotations + G14. Agent side uses mp annotation create (kind=approval-request) and reads resolution via mp; human side uses raul to review the request and approve/resolve it (delegating mp milestone approve + mp annotation resolve).",
    "Co-approval mode: a human-guided flow where a human and an agent step through an approval decision together in raul (agent presents the spec/change, human reviews inline, they iterate, human signs off) - the G14 gate clears only on the human's final resolve. Distinct from solo human approval (M44).",
    "Understanding surface: raul explainers - why a milestone is blocked (G14 + other gates), what each gate means, plan health overview, and an onboarding walkthrough for humans new to a project. Read-only, computed from mp --format json.",
    "Review surface completion: add raul equivalents for the human views M41 dropped - raul inbox, raul validate (human-readable validation report), raul decision, raul execution - so no human capability lost in 2.0.",
    "Wire all new raul views/actions through the shared read layer (M44 S1) and delegate every write to mp (raul never writes plan files).",
    "Docs: extend MP-COMMANDS/raul docs and master-planner SKILL.md with the review/approval/understanding workflows.",
]
out_of_scope = [
    "Rebuilding raul's UX/design system (deferred to a later UX-polish milestone; this milestone delivers function, not polish)",
    "Changing the mp annotation data model or G14 gate (those are M43; this milestone consumes them)",
    "Making raul write plan files (hard rule: raul delegates all writes to mp)",
    "A GUI or web surface (raul stays a CLI + TUI)",
    "Automated approval (a human is always in the loop; the co-approval mode pairs human+agent, never agent-alone sign-off)",
]

