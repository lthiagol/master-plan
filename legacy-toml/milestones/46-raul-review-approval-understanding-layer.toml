[intent]
outcome = "raul becomes the human-facing review, approval, and understanding layer for a Master-Plan project: humans review the plan and act on review requests, approve work via a structured approval flow (agents request approval through mp; humans approve through raul; optionally a human-guided co-approval mode where human and agent iterate together before sign-off), and UNDERSTAND the plan through explainer/onboarding surfaces. Agents stay focused on mp; humans live in raul."

[problem]
description = "After 2.0, mp is agent-only (M41) and raul has a minimal review TUI (M44) plus CLI views for a handful of queries. But the human side is incomplete in three ways. (1) APPROVAL is not a first-class flow: M43/M44 let a human resolve an approval-request annotation and delegate mp milestone approve, but there is no structured agent-requests / human-approves loop and no way for a human to guide an agent through an approval decision together. (2) raul's REVIEW surface has gaps: M41 drops mp inbox/validate/decision/execution human views and raul has no equivalents, so humans lose those capabilities. (3) raul does not help humans UNDERSTAND a plan they did not author (why is a milestone blocked, what does gate G14 mean, what is the plan health, onboarding). This milestone makes raul the coherent review+approval+understanding surface. UX polish is explicitly deferred (this milestone delivers function; a later UX pass refines it)."

