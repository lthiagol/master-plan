[[design_decisions]]
area = ""
choice = "Upgrade ratatui 0.29 → 0.30 with crossterm_0_29 feature"
rationale = "Workspace crossterm 0.29 pin alone left ratatui 0.29 pulling crossterm 0.28 (duplicate stack). ratatui 0.30 + crossterm_0_29 unifies on crossterm 0.29.0 only; required for AC-01."

