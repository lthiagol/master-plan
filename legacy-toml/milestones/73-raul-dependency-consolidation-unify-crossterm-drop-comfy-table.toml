[intent]
outcome = "raul compiles against a single crossterm version via workspace pin. CLI table commands use a shared raul::table helper or ratatui Table — comfy-table removed from Cargo.toml. Transitive unique count drops measurably (target <100). All raul tests and TUI flows unchanged visually at a glance."

[problem]
description = "M21 dependency diet targeted mp only. raul ships 118 unique transitive crates (1.9MB binary) with duplicate terminal stacks: crossterm 0.28.1 (direct + ratatui) AND crossterm 0.29.0 (via comfy-table). Three styling layers overlap — ratatui+crossterm for TUI, comfy-table for CLI tables in ~15 command modules, owo-colors for ANSI everywhere. This is the highest-ROI remaining diet in the repo: dedupe crossterm immediately; consolidate table/color output into ratatui/crossterm to remove comfy-table (and optionally owo-colors)."

