[intent]
outcome = "mp can import plan content from existing markdown via --from-repo, and authoring milestones via JSON is reliable and well-documented."

[problem]
description = "Field testing (lazybrew adoption, I-04/I-05/I-06) found: (1) `mp init --from-repo` produced no charter draft or backlog candidates despite rich source material (status.md, backlog.md with B-xx items) - it appears to scan only source code; (2) `mp milestone create --json @-` via stdin heredoc did not populate structured fields, forcing a fallback to --file; (3) the JSON input schema is undocumented and the expected shape (separate top-level problem.description vs intent.problem) was discovered by trial and error. Inbox idea ID-01 (`mp milestone create --example`) is the same authoring-friction surface."

