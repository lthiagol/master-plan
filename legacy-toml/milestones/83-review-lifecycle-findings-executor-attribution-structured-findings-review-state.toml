[intent]
outcome = "Every milestone tracks its full execute→review→remediate cycle: who executed it, who reviewed it, what findings were raised (with severity and open/fixed status), and where each was fixed. A derived review_state (pending-review, reviewed-clean, reviewed-with-findings, remediated, verified) makes the cycle observable across the project, so a reviewer/maintainer can answer 'what was found, what's still open, who fixed it' without grepping chat or notes prose."

[problem]
description = "mp records only a flat review verdict (reviewer + verdict + a free-text notes paragraph) via mp reviews pass. It captures neither who EXECUTED the milestone nor structured FINDINGS (issues with severity/status) nor remediation links (which commit fixed a finding). The execute→review→remediate contract (M64) is enforced but not observable: the M77/M78/M79 independent reviews left their findings only in review notes prose and chat — unstructured, untrackable, and lost to history. There is no way to list open findings across the project, no executor attribution, and no lifecycle state distinguishing 'done but unreviewed' from 'reviewed with open issues' from 'remediated'. This milestone closes that gap (the raul Kanban board that visualizes it is a separate follow-up, M84)."

