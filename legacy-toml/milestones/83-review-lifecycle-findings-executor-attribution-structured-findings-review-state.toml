[scope]
in_scope = [
    "Executor attribution: mp milestone complete --executor <name> records who/what executed; surfaced in mp show and raul",
    "Structured findings on reviews: [[reviews.findings]] with id (F-NN), severity (high/medium/low), category, description, status (open/fixed/wontfix), fixed_in (commit/ref)",
    "Finding commands: mp reviews finding add <mid> --severity --category --desc; mp reviews finding resolve <mid> <fid> --commit <ref>; mp reviews finding list [--open]",
    "Derived review_state per milestone (pending-review / reviewed-clean / reviewed-with-findings / remediated / verified), computed from execution_status + reviews + open findings; exposed in mp status/show",
    "mp reviews lifecycle — a cross-project rollup of milestones by review_state (counts + ids), for at-a-glance health",
    "mp show milestone renders executor, reviewers, and the findings list (open findings surfaced)",
    "mp validate warns on done-but-unreviewed milestones (review hygiene)",
]
out_of_scope = [
    "The raul TUI Kanban board view — separate milestone M84 (consumes this data)",
    "Review assignment / request workflow (who SHOULD review) — defer; this tracks reviews that happened",
    "Changing the existing mp reviews pass verdict model (additive only)",
]

