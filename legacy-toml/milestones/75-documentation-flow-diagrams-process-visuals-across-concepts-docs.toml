[intent]
outcome = "Readers grasp key Master Plan workflows at a glance via mermaid diagrams in concept docs, plus a dedicated RAUL.md human entry guide — without duplicating M48 static model diagrams or maintaining parallel methodology prose."

[problem]
description = "M48 shipped static resource/anatomy/command-hierarchy diagrams in SPEC.md and MP-COMMANDS.md, but most *process* flows remain ASCII boxes or prose-only. Dogfooding M70 handoff showed the gap: a sequence diagram made the ceremony click instantly. EXECUTION-MODES, AGENT-PLAYBOOK, PM-WORKFLOWS, INSTALL, and post-M64 execute→review→remediate are high-traffic paths with weak visual affordances. No catalog ties diagram type to doc purpose (sequence for ceremonies, flowchart for pipelines, graph for data — per M48)."

