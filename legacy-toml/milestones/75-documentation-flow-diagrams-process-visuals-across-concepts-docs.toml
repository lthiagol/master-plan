[scope]
in_scope = [
    "Audit docs/concepts/** and produce a prioritized flow-diagram backlog (doc, flow name, recommended diagram type, audience)",
    "Add docs/concepts/00-Concepts.md visual index section linking each diagram to its home doc",
    "Diagram style guide snippet: when to use sequenceDiagram vs flowchart vs graph TD vs keep ASCII",
    "Audience routing model: shared concepts, mp agent commands, raul human display (single-source policy)",
    "docs/concepts/02 - Getting Started/RAUL.md — human PM entry guide (routes to concepts; daily raul commands; links TUI walkthrough; MP-COMMANDS section 22 becomes pointer)",
    "EXECUTION-MODES.md: handoff ceremony sequence (check → handoff → baseline → diff → pause) reflecting M70 baseline",
    "AGENT-PLAYBOOK.md or EXECUTION-MODES: execute → review → remediate loop (M64) + agent session start flow",
    "PM-WORKFLOWS.md: upgrade intake funnel ASCII to flowchart (or hybrid) where it improves scanability",
    "INSTALL.md: harness install path diagram (make/mp → harness registry → doctor)",
    "WALKTHROUGH.md: cross-link new handoff/diff commands where M03 timeline references handoff",
    "Broken/stale diagram audit: verify existing mermaid in SPEC, WALKTHROUGH, MP-COMMANDS still renders and matches shipped commands",
]
out_of_scope = [
    "Replacing M48 resource/anatomy/command-hierarchy diagrams (maintain only if drift found)",
    "Full prose rewrite of every concepts doc",
    "raul TUI screenshots or interactive diagrams",
    "Clap-derived command table generation (parked as idea ID-10)",
    "Diagrams inside plan milestone TOML or skill template (docs zone only unless one-line cross-link)",
]

