[scope]
in_scope = [
    "Per-milestone optional `target_version` field (e.g. '1.6.0'), distinct from the project-level next-version",
    "Release registry (releases.toml or plan.toml [[releases]]) grouping milestone IDs by version with status (planned|shipped) and date",
    "`mp release list` / `mp release map` - view version -> milestones (planned + shipped)",
    "`mp release show <version>` - milestones, status, and date for one version",
    "`mp milestone set-target-version <id> <ver>` (or `mp release assign <ver> --milestone <id>`)",
    "`mp release ship <version>` - mark a planned version shipped and stamp the date",
    "Integration tests: assign + map reflects it; show returns members; ship stamps date and guards on unfinished milestones",
]
out_of_scope = [
    "Automated semver bumping heuristics (the user chooses the version string)",
    "CI publishing / artifact upload (release scoping only, not distribution)",
    "Git tag creation (existing release workflow owns tagging; mp may suggest it)",
]

