[intent]
outcome = "Planners can assign each milestone to a target release version and view a map of which milestones ship in which version (planned and shipped), with dates."

[problem]
description = "mp currently tracks only a single project-wide target_version (`mp plan set --target-version`), so there is no way to express 'M1 and M2 ship in v1.0.0, M3 in v1.0.1, M4 in v1.2.0'. Milestones carry no per-milestone release targeting, there is no release registry mapping versions to milestone groups, and no command to view the planned-vs-shipped release map. As a result release scoping lives only in maintainers' heads and the hand-maintained CHANGELOG.md."

