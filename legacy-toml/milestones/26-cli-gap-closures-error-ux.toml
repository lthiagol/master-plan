[[steps]]
id = "S1"
work_package = "WP1"
order = 1
action = "step update: add a --depends-on-steps flag that sets, persists, and validates the depends_on_steps field"
files = [
    "crates/mp/src/step.rs",
    "crates/mp/src/cli.rs",
]
tests = "crates/mp/tests/step_deps.rs: set deps via step update; mp show milestone shows depends_on_steps"
done_when = "step update --depends-on-steps persists and validates step dependencies"
status = "done"
covers_ac = ["AC-01"]
depends_on_steps = []

[[steps]]
id = "S2"
work_package = "WP1"
order = 2
action = "Add 'mp plan principles add <text>' to append to charter principles without hand-editing plan.toml"
files = [
    "crates/mp/src/charter.rs",
    "crates/mp/src/cli.rs",
]
tests = "crates/mp/tests/plan_principles.rs: add a principle; mp plan show lists it"
done_when = "plan principles add appends a principle visible in mp plan show"
status = "done"
covers_ac = ["AC-02"]
depends_on_steps = []

[[steps]]
id = "S3"
work_package = "WP1"
order = 3
action = "Improve milestone create/update validation errors: include the JSON path / TOML field and hint at --example or the schema"
