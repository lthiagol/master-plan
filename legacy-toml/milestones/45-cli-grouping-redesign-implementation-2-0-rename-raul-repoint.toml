[intent]
outcome = "The mp CLI command surface is regrouped per M38's taxonomy (object groups + a small set of lifecycle verbs) as a HARD 2.0 rename with NO aliases: mp next/next-step collapsed, verb-first standalones (archive/restore/purge/groom/challenge/digest/note/delta/export) homed under object groups, and every raul shell-out repointed in-lockstep (crates/raul/src/mp_runner.rs) - all shipping in the 2.0 release."

[problem]
description = "M38 delivers the grouping DESIGN only (all four of its steps are manual design-doc reviews). The actual in-code rename, raul repoint, and test/doc/skill/golden-scenario migration are otherwise unplanned for 2.0. Without this milestone the single biggest cheap-now-expensive-later breaking change (command renames, per the 2.0 clean-break intent and D-012) slips past 2.0 and becomes expensive to do later when consumers exist on the renamed surface."

