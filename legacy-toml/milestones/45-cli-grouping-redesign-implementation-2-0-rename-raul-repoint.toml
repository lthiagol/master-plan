[scope]
in_scope = [
    "Implement M38's target taxonomy in crates/mp/src/cli.rs + app.rs dispatch: rename verbs, collapse mp next and mp next-step into one, home the verb-first standalones under their object groups",
    "Repoint every raul shell-out (crates/raul/src/mp_runner.rs and commands/*: status, list milestones, show milestone, next-step, path, idea create, digest, graph, annotation) to the new command names in the SAME change",
    "Update master-planner SKILL.md, AGENTS.md, MP-COMMANDS.md, AGENT-PLAYBOOK.md, EDGE-CASES.md to the new command surface (no aliases, no deprecation notes)",
    "Rewrite golden scenarios (tests/scenarios/) and integration tests (crates/mp/tests/) for the new verbs; keep --format json shapes UNCHANGED (D-011 clause 1)",
    "Rename --format raw to --format toml as part of the clean break (cheap format-name break, free now)",
    "CHANGELOG entry for the 2.0 breaking rename + the raw->toml rename",
]
out_of_scope = [
    "The grouping DESIGN (that is M38; this milestone consumes M38's output)",
    "Changing --format json output shapes (D-011 clause 1 freeze holds)",
    "New commands or features (pure rename/regroup/repoint)",
    "Any deprecated-alias surface or transition period (forbidden by D-012)",
]

