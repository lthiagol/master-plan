[intent]
outcome = "Opening raul -i lands on a welcome / plan-overview lane (first sidebar tab) that answers 'what is the state of the plan and what should I do?' in one screen — the same rollup a maintainer gets from mp status + mp inbox + path preview, without running separate commands or reading JSON."

[problem]
description = "The Board lane (M84) shows review-cycle health across milestones; the Status lane (M77) shows a thin dashboard (mode, counts, 8 inbox lines). Neither reproduces the session-start briefing agents and humans get from mp status + mp inbox: planned vs done counts, suggested next step, items awaiting approval/grooming, pending tracks/tweaks, and blockers. Maintainers still context-switch between lanes or fall back to the CLI. This milestone adds a dedicated welcome/overview lane as the default TUI entry point."

