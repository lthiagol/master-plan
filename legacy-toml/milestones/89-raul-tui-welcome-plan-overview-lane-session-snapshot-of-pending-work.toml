[[design_decisions]]
area = ""
choice = "Evolve existing Status lane into Home/Overview (not a 9th lane)"
rationale = "Status is already first in sidebar and loads status+inbox; extending DashboardSnapshot avoids another lane label and matches user ask for first tab welcome screen."

[[design_decisions]]
area = ""
choice = "Default TUI start lane = Overview; --board overrides to Board only"
rationale = "Welcome is the session briefing; board remains opt-in for review-cycle drill-down (M84)."

