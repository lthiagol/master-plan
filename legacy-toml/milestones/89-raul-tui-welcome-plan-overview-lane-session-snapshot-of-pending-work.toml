[scope]
in_scope = [
    "New or renamed first sidebar lane (Home / Overview) — default when raul -i starts (raul --board still jumps to Board)",
    "Single-screen rollup from mp status: planning_status, execution.mode, milestone execution/spec counts, pending_review_count, track_pending, inbox_count, blockers",
    "Suggested next action + path preview (from status.suggested_path)",
    "Full inbox list (mp inbox) rendered with kind, reason, and suggested action — grouped or sectioned (milestones to approve, grooming, tracks, ideas)",
    "Refresh via r; palette-aware render (M85 effective_palette)",
    "Enter on an inbox row navigates to the best lane (e.g. track → Tweaks, milestone → Milestones or drill-in hint) or copies action hint to flash line",
    "Unit tests for snapshot builder + render output (fixture JSON, no live mp in unit tests)",
]
out_of_scope = [
    "Replacing mp CLI for agents (raul remains human-facing)",
    "Board Kanban changes (M84)",
    "Rich markdown rendering in overview (defer to M86 if needed)",
    "Writable actions from overview (approve/groom still via mp/CLI; navigation only)",
    "New mp commands — consume existing status/inbox/path JSON",
]

