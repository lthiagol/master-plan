    "raul TUI home/dashboard screen: aggregates mp status, inbox count, pending-review count (when M64 lands), suggested path preview, open annotations summary",
    "Navigation from dashboard to existing review/tracks/backlog TUI screens",
    "raul watch: poll mp status + inbox on interval (CLI flags --interval, --once); plain-text or minimal TUI ticker",
    "mp digest --since <iso|--handoff|--days N> filter; --format markdown export to stdout or --out file",
    "raul digest: wraps mp digest with human formatting and optional --open (pager/print path)",
    "Integration tests: dashboard state wiring (unit), digest --since filters, watch --once smoke",
]
out_of_scope = [
    "Email/Slack scheduled delivery (export file only)",
    "Full Gantt/timeline visualization",
    "Write operations from dashboard (read-only aggregate)",
    "Building M64 reviews commands inside this milestone (consume when available; graceful empty if not)",
]

