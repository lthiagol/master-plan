[intent]
outcome = "Humans open raul and immediately see inbox, pending reviews (M64 when shipped), path preview, annotations, and execution mode. They can watch plan state refresh without retyping commands. They can export a digest since last handoff as markdown for stakeholders."

[problem]
description = "M41 moved human-readable output to raul; M44/M46/M50/M54 built review TUI and tracks/backlog views. But humans still lack a single 'what needs my attention?' landing experience. Agents have mp status + mp inbox; raul requires knowing which subcommand to run. There is no passive monitor while an agent executes autonomously. mp digest exists but lacks --since filtering and export paths for stakeholder updates on a cadence (post-handoff, weekly)."

