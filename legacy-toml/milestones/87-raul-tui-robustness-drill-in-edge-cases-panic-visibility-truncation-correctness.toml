[intent]
outcome = "Raul TUI drill-in paths work under hide_done filtering, latent panics are diagnosable instead of silently exiting 0, text truncation uses char counts not byte counts, co-approval tolerates approve failure, and track lanes omit redundant kind prefixes. Status/Overview focus-key routing (formerly AC-04/S4) is deferred to M91 top-tab layout."

[problem]
description = "A focused audit of raul TUI surfaced robustness bugs M85 defers. (1) Board/Path/Inbox drill-in vs hide_done silently fails for done milestones. (2) TUI panics swallowed in catch_unwind. (3) Byte-vs-char truncation in render.rs, watch.rs, annotation.rs. (4) runner.rs co-approval ? propagates before let _ binding. (5) render_tracks_list redundant [kind] prefix in filtered lanes. Status/Overview Tab and focus-key routing deferred to M91 per CH-87-01."

