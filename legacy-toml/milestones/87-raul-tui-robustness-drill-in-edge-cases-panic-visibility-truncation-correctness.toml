    "New features beyond these robustness fixes",
]

[[acceptance_criteria]]
id = "AC-01"
description = "Drilling into a done milestone from the Board (or Path/Inbox) succeeds even when hide_done is enabled. Today enter_milestone_detail indexes visible_milestones() but the position comes from the full vec, so the lookup silently fails for done milestones. Test: set hide_done=true, select a done Board card, press Enter, assert content transitions to MilestoneDetail with the correct milestone id."
verification = "crates/raul/tests/tui_drill_in.rs"
status = "pending"
evidence = ""

[[acceptance_criteria]]
id = "AC-02"
description = "A panic inside the TUI event loop prints the panic payload to stderr and exits non-zero, instead of mapping Err(_) => Ok(()) (silent exit 0). Test: inject a panic via a test helper and assert stderr contains the payload and the return is non-zero / an error propagates."
verification = "crates/raul/tests/tui_panic.rs"
status = "pending"
evidence = ""

[[acceptance_criteria]]
id = "AC-03"
description = "Text truncation uses char count, not byte length. In render.rs annotation preview, watch.rs, and annotation.rs list: a multi-byte body of 50 chars (but >60 bytes) does NOT get ... appended; a body of 70 chars DOES. Test feeds a CJK/em-dash string and asserts the boundary."
verification = "crates/raul/tests/truncation.rs"
status = "pending"
evidence = ""

[[acceptance_criteria]]
id = "AC-05"
description = "Co-approval path tolerates mp milestone approve failure: runner.rs:444 no longer propagates via ? before the let _ binding — approve failure does not abort annotation loading. Test: approve returns error, assert annotations still load and the command returns Ok."
verification = "crates/raul/tests/approval_flow.rs"
status = "pending"
evidence = ""

[[acceptance_criteria]]
id = "AC-06"
description = "render_tracks_list rows omit the redundant [kind] prefix in lanes that already filter by kind (Bugfixes shows only bugfix items, Tweaks only tweaks). Test: bugfix lane rows do not contain a [bugfix] token."
verification = "crates/raul/tests/tracks.rs"
status = "pending"
evidence = ""

[[acceptance_criteria]]
id = "AC-07"
description = "All existing raul tests pass (cargo test -p raul); no regressions"
verification = "cargo test -p raul"
status = "pending"
evidence = ""

