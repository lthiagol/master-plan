[intent]
outcome = "Every state mutation (step done, criterion pass, track done) is reliably recorded when the work completes — via convention, encoded post-conditions, a validate-time drift check, and an auto-close helper — so raul and mp status always reflect reality and can be trusted for execution tracking."

[problem]
description = "Agents executing plan steps routinely forget to run state-tracking commands (step done, track done, criterion pass) after completing the code work. This leaves tracks pending forever, milestones stuck in in-progress, and raul status showing stale data. Examples: TW-04/TW-06/TW-07 were all shipped in M47 but never closed in the track system until manually caught. The root cause is that the plan step says 'do the work' but nothing enforces or reminds the agent to also update the state. Three mitigation layers exist: (1) convention in AGENTS.md, (2) encoding track-done in the step tests field so running tests auto-closes the track, (3) validate-time warnings when a done step references a still-pending track item."

