    "AGENTS.md convention: every step that references a TW/BF item must close it via mp track done after completing the work",
    "Step tests field encoding: steps referencing track items include mp track done in their tests value as a post-condition",
    "Validate-time drift check (W30): mp validate warns when a done step references a track item still in pending/in-progress status",
    "Auto-close helper: mp step done scans the step action for TW-/BF- patterns and closes referenced tracks automatically",
    "Review and refresh this repo's master-plan/AGENTS.md content",
]
