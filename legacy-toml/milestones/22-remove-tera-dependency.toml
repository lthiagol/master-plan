[intent]
outcome = "tera dependency removed from mp; render_track_human uses the same format!-based approach as render_milestone_human; ~30 transitive crates dropped (pest, phf, chrono-tz, slug, humansize, url, idna, icu_*, globwalk, ignore, rand, fnv); render layer is consistent and dependency-free."

[problem]
description = "tera is used in exactly 1 function (render::render_track_human, render.rs:88) with 1 template (templates/views/track.md, 41 lines) using only 4 Tera features: {{ var }}, {% for %}, {% if %}, {% else %}. The other renderer (render_milestone_human, render.rs:7) already uses pure format! — no tera. This split is inconsistent. tera pulls ~30 transitive crates (pest parser framework, phf perfect hash, chrono-tz timezone database, slug, humansize, url -> idna -> icu_* unicode normalization, globwalk, ignore, rand, fnv, lazy_static) — all for 4 template features in 1 function. Note: templates/views/ contains 7 other orphaned templates (ideas.md, plan-status.md, milestone.md, charter.md, backlog.md, milestone-list.md, brief.md) that are NOT loaded by any code — they are unused assets, separate concern."

