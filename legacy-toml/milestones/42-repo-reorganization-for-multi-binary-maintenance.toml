[scope]
in_scope = [
    "Add crates/raul as a workspace member with a compilable stub (Cargo.toml + src/main.rs printing version only; NOT the real raul build — that is M40)",
    "Create tests/raul/ placeholder (README + .gitkeep) so M40 raul tests have a home; create tests/mp/ placeholder for symmetry/future per-binary scenarios",
    "Keep tests/fixtures/ shared where it is (both binaries shell into these plan dirs) — do NOT move fixtures",
    "Leave tests/scenarios/ in place for now (currently mp-only golden scenarios); document that raul scenarios land under tests/raul/ later — defer the move to avoid scenarios_runner churn",
    "Fix stale doc path: AGENTS.md references tests/scenarios_runner.rs but the runner is at crates/mp/tests/scenarios_runner.rs",
    "Update .github/workflows/plan.yml path filters to include crates/raul/** (so CI triggers on raul changes)",
    "Add Makefile targets: build/check/test should cover both binaries (e.g. make build builds mp + raul stub); keep mp-only targets working",
    "Doc sync: AGENTS.md (test layout + raul mention + stale path fix), ARCHITECTURE.md (module map note that raul is a sibling crate, test structure table)",
    "Full green verification after reorg: cargo build, cargo test -p mp, make test-fixtures, make test-scenarios, make adopt-check",
]
out_of_scope = [
    "Moving skill source out of templates/skills/ (conservative pass)",
    "Moving schemas/, scripts/, bin/, feedback/, templates/ (conservative pass)",
    "Moving tests/scenarios/ into tests/mp/scenarios/ (deferred — avoid scenarios_runner churn; raul scenarios land separately)",
    "Building the real raul (that is M40) — this milestone only makes a compilable stub slot",
    "Any change to master-plan/ (plan zone, sacred)",
    "Renaming the mp binary or crate",
    "Consolidating ci/Dockerfile (single file, not worth a move)",
]

