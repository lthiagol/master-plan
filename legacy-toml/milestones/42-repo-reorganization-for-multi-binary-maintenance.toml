[intent]
outcome = "A repo layout ready for a second binary: crates/raul is a workspace member with a compilable stub, tests/raul has a home, shared fixtures stay shared, and all build/test/CI/docs paths are updated and green — so M40 (raul CLI MVP) just fills in crates/raul rather than also reorganizing the repo."

[problem]
description = "The repo grew around a single binary. Integration tests are already correctly per-crate (crates/mp/tests/, 73 files), but root tests/ holds shared infra (fixtures/, scenarios/) with no per-binary split, there is no crates/raul slot, AGENTS.md has a stale scenarios_runner path, and .github/workflows/plan.yml path filters would not trigger on raul changes. Before raul lands we want a conservative tidy-up so the second binary has a natural home without a later expensive move."

