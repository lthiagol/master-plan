[scope]
in_scope = [
    "Embed templates/ and schemas/ into the binary at compile time (include_dir / rust-embed / include_str!)",
    "Resolve asset reads from embedded assets first, with MP_HOME remaining an optional filesystem override",
    "Verify `cargo install --path crates/mp` produces a fully working mp with no asset files present",
    "Remove MP_HOME from install guidance and docs (keep it as an optional override)",
    "Add a parity test confirming embedded template output matches the on-disk equivalents",
    "Update INSTALL.md and the make install message to reflect the self-contained binary",
]
out_of_scope = [
    "Embedding the master-planner SKILL.md (handled by the skill install path)",
    "Embedding the full docs/ tree (runtime doc lookup stays filesystem/MP_HOME-based)",
    "Changing plan-zone discovery (master-plan/ vs .mp/) logic",
    "Publishing a new Homebrew formula (separate milestone; this one unblocks it)",
]

