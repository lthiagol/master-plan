[intent]
outcome = "The mp binary ships with all templates and schemas compiled in, so it runs with zero filesystem setup — enabling zero-config `cargo install` and Homebrew installs with no MP_HOME and no separate asset files."

[problem]
description = "Today mp reads templates and schemas from disk via toolkit_home() (assets.rs `read_embedded` does std::fs::read_to_string). Any distribution that ships only the binary — Homebrew's documented `cargo install --path crates/mp`, `cargo install mp`, or copying the binary — breaks because the assets cannot be found. Only `make install` works because it copies templates/ and schemas/ to ~/.agents/master-plan. This blocks the zero-config install story and forces every user to manage MP_HOME or asset files manually."

