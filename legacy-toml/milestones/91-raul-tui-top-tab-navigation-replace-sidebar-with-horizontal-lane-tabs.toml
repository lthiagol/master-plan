[intent]
outcome = "raul -i uses a browser-style horizontal tab bar at the top of the terminal for lane navigation (Overview, Milestones, Path, Bugfixes, Tweaks, Backlog, Board). The content pane fills the space below. Lane switching is one click or keystroke; long lists (especially Milestones) scroll via Page Up/Page Down and mouse wheel; drill-in, review board, and overview behaviors from M77/M84/M89 are preserved without the left sidebar, gutter resize, or sidebar/content focus split."

[problem]
description = "M77 rebuilt raul around a persistent left sidebar of tabbed lanes plus a right content pane — a deliberate improvement over the old view stack, but visually unlike familiar browser or IDE tab bars. The sidebar consumes horizontal space (~15–30 cols), requires a separate focus model (Tab toggles sidebar vs content), and ships gutter-drag resize machinery that most users never touch. Eight lanes (post-M89) also make the vertical sidebar long on short terminals. A top horizontal tab bar would give lanes equal prominence, reclaim width for content (especially Board and milestone detail), and match the mental model users asked for ('tabs like a web browser'). This is a layout shell replacement, not a feature add — all existing lanes and drill-in paths must survive the migration."

