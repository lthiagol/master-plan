[milestone]
id = "60"
title = "Grooming-depth rubric: 'is this groomed enough?' + readiness validate warnings"
slug = "grooming-depth-rubric-is-this-groomed-enough-readiness-validate-warnings"
spec_status = "verified"
execution_status = "done"
depends_on = []
