[scope]
in_scope = [
    "Author a GROOMING.md rubric: the full definition of 'groomed enough' — capability-sized steps (not micro, not bundled), non-empty done_when on every step, AC<->step coverage, no bundled unrelated concerns, real (non-hypothetical) AC examples, design note required for high-ambiguity/integration milestones, no stale references.",
    "Formalize the design-note convention: when required (risk=medium/high or integration-heavy), where it lives (the design_decisions field vs a linked doc), and what it contains (interactions, alternatives considered, risky seams).",
    "Add mp validate warning W40: a step has an empty done_when field.",
    "Add mp validate warning W41: a step tests or AC verification value is 'manual: accepted' with no justification reason — enforces the AGENTS.md convention that manual tests state a reason. (G10 already covers uncovered-AC strictly under strictness=full, so W41 targets a different smell.)",
    "Add mp validate warning W42: a milestone with risk=medium or risk=high has empty design_decisions (the design-note nudge for ambiguous work).",
    "Add `mp milestone design-decision add <id> --decision <text> --rationale <text>` so design_decisions is writable via CLI — currently NO writer exists, so W42 would warn about something users cannot fix through the toolkit.",
    "Add mp validate warning W43: a step action or AC references a milestone/step id (e.g. M55, S3) that does not exist in the plan (stale-reference catch).",
    "Add an 'Is this groomed enough?' section to AGENTS.md pointing at GROOMING.md, and cross-link from the groom/interview flow.",
    "Dogfood: run the new checks on this repo's own plan and resolve every W40-W43 they surface (backfill done_when, cover uncovered ACs, add design notes where flagged).",
]
out_of_scope = [
    "Changing the semantics of the existing G1-G10 gates.",
    "Auto-decomposition or auto-generation of steps/design notes.",
    "A standalone mp milestone readiness scoring command (the warnings cover the machine-checkable subset).",
    "Forcing design notes on low-risk, low-ambiguity milestones.",
]

