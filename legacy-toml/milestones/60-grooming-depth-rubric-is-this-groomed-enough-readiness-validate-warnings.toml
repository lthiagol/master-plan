target_version = "2.0.0-rc.1"

[intent]
outcome = "'Is this groomed enough?' has a canonical answer: a documented rubric (GROOMING.md) for the human-judgment parts and four new mp validate warnings (W40-W43) for the machine-checkable parts, so spec_status: ready reliably implies execution-readiness quality, not just mechanical gate compliance."

[problem]
description = "spec_status: ready only proves the mechanical gates (G1-G10) pass — it says nothing about readiness quality. A challenge pass over the 10 spec-ready milestones found repeated quality gaps that gates do not catch: empty done_when on every step (M54/M55); bundled unrelated concerns in one milestone (M51); ACs with no covering step (G10 only fires under strictness=full); unverifiable AC examples referencing non-existent artifacts (M53 'oauth'); missing integration design for high-risk work (M56 Make-to-Rust bridge); stale references to done/deleted milestones (M48 'coordinate with M47'). Because none of this is encoded, contributors re-ask 'is this groomed enough?' every milestone with no shared definition. The machine-checkable subset should become validate warnings; the rest should become a rubric doc."

