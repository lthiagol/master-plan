[[ideas]]
id = "ID-03"
title = "Native dependency/impact queries in mp (reverse deps + blast radius)"
body = "Today, answering dependency questions about a milestone requires ad-hoc scripts over mp show --format json. Real questions hit during planning: (1) reverse deps -- does anything depend on M39? (looped mp show milestone over all planned milestones and inspected depends_on); (2) path-pin involvement -- do any pins reference M39? (mp path list-pins + filter); (3) transitive blast radius -- if I block/delete/reorder this milestone, what is affected? mp already has a forward dependency graph (crates/mp/src/graph.rs, mp graph), but there is no native QUERY/REVERSE dimension. Proposed: mp milestone dependents <id> (who depends on this) and mp milestone deps <id> (what this depends on), both --format json; and mp milestone impact <id> that returns the transitive blast radius (reverse deps + any path pins involving the id + path implications). Bonus: mp path list-pins --milestone <id> filter. Removes the need to hand-parse JSON for every dependency/impact check and makes block/delete/reorder decisions self-service. Note: would also have caught the M45/M46 depends_on drop silently during mp milestone create."
status = "archived"
tags = [
    "mp-cli",
    "dependencies",
    "graph",
    "path",
]
source = "planning session"
created = "2026-06-28"
promoted_to = ""

[[ideas]]
id = "ID-04"
title = "raul: complete the review surface (tracks + backlog views M46 missed)"
body = """
After M41 made mp agent-only (only --format json/toml) and M46 added raul inbox/validate/decision/execution to cover the human views M41 dropped, two surfaces were MISSED: raul has no 'tracks' and no 'backlog' subcommand. Today there is no human-readable way to list tracks or backlog. A reviewer (human or agent) must pipe 'mp list tracks --format json' through an external tool (jq/python) to get a readable view, and if that parse fails they reach for grepping the plan TOML directly, which is a plan-zone violation.

Observed in the wild during the M38/41/43/44/45/46 review session: I ran 'mp list tracks --format json' through python to get a flat one-line-per-track view, and when my parse of the nested shape failed I fell back to grepping master-plan/tracks/*.toml. The same gap applies to backlog.

Scope when tackled: add 'raul tracks' (list + show item) and 'raul backlog' (list) reading via the M44 shared read layer over mp JSON, mirroring how raul milestones/show/inbox already work. This completes M46 AC-04's 'no human capability lost vs pre-2.0' promise, which today is technically violated for tracks/backlog.

Related: ID-03 (native dependency/impact queries) — same theme of 'agent/reviewer cannot get what they need without reshaping mp JSON externally'. Also surfaced a secondary bug while checking this: 'mp list tracks --format toml' emits JSON instead of TOML (the list commands ignore the format flag) — worth fixing alongside or as its own tweak.

Source: discovered during post-v2.0 review cleanup (commit 84ef021)."""
status = "archived"
tags = [
    "raul",
    "review-surface",
    "m46-followup",
    "m41-followup",
]
source = "conversation"
created = "2026-06-29"
promoted_to = ""

[[ideas]]
id = "ID-05"
title = "Dedicated mp planner agent (full read + mp, optimized for planning runs)"
body = """
A dedicated agent profile (custom-agent/subagent role) for harnesses (opencode, cursor, codex, claude, pi, etc.) that has full Master-Plan read capabilities and direct mp write access, purpose-built to optimize planning sessions - fast spec/groom/step/decompose work without the context overhead and tool-noise of a general coding agent.

Distinct from the master-planner SKILL.md (which teaches ANY agent the plan workflow): this is a dedicated agent ROLE with a scoped tool surface - read everything in the plan zone, mp writes for spec/plan/state mutations, and minimal code-zone tools - tuned for planning throughput and lower token cost on long planning runs.

Owner vision: 'an agent that has full read capabilities and can use mp so we can optimize when running planning.'

Depends on M51 (install/distribution architecture) for the agent-profile install rail - M51 deploys binaries + skill + convention file + AGENT PROFILES per harness; this idea is the planner profile itself that M51 would deploy. Sequence: M51 (install rail) then this (the profile).

Open design questions for when it becomes a milestone: (1) which harnesses' agent-profile formats to target first (opencode custom agents, cursor subagents, pi extensions); (2) the exact tool-permission scope (read-all + mp-only writes? allow raul?); (3) whether it ships as one canonical profile adapted per harness or per-harness variants; (4) how it interacts with autonomous execution mode (mp execution handoff).

Source: owner vision, captured during M51 install-architecture spec discussion."""
status = "open"
tags = [
    "agent-profile",
    "planning",
    "m51-dependency",
    "future",
]
source = "conversation"
created = "2026-06-29"
promoted_to = ""

