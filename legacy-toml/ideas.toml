title = "Doc generation: clap-derived command tables + optional snippet includes"
body = """
Park optional doc-automation so we do not duplicate mp vs raul command reference by hand.

Problem: MP-COMMANDS.md §1–21 (mp) and §22 (raul) plus the mp→raul mapping table drift when CLI changes. Workflow prose and mermaid in docs/concepts should stay hand-authored (M75); only mechanical command surfaces are good generation candidates.

Proposed scope (future milestone):
- Generate mp command tree + raul command list from clap metadata (crates/mp, crates/raul) into a committed markdown fragment or MP-COMMANDS subsection
- Optional: mdBook/includes or build.rs step to embed shared mermaid snippets (e.g. handoff sequence) in multiple docs without copy-paste
- CI check: regen diff fails PR if clap changed but docs fragment not updated
- Explicitly NOT: auto-generate methodology prose, AGENT-PLAYBOOK, or EXECUTION-MODES flows

Depends on: M75 audience-routing model (shared concepts + split command reference). Related: M48 command-hierarchy diagram drift.

Trigger: when MP-COMMANDS §22 grows painful to maintain or M71 adds many raul commands."""
