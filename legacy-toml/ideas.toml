Proposal: add a tree (or indented hierarchy) view mode in the Milestones lane — show milestones nested or connected by depends_on / path order, similar to a file tree or git log --graph. Toggle flat list vs tree; optional highlight for blockers on the critical path.

Leverage existing mp graph / depends_on data (mp show milestone, mp path, mp graph) via reads layer — no hand-maintained hierarchy field required unless we want explicit grouping.

