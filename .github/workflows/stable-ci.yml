name: stable-ci

on:
  push:
    branches: [stable]
    # Tag convention: git tag = v<semver>, package version = <semver>.
    # Pre-releases use bare rcN (not rc.N): v1.0.0-rc1 / 1.0.0-rc1.
    # Filter is 'v*' — a tag without the v prefix will not fire this workflow.
    tags: ['v*']
  pull_request:
    branches: [stable]
  workflow_dispatch:

jobs:
  ci:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: master-plan

      - name: Install nextest
        run: cargo install cargo-nextest --locked --version '^0.9'

      - name: Install ripgrep
        # Required by scripts/check-consumer-surface.sh (part of `make lint`).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep

      # raul tests shell out to `mp` via find_mp (PATH / MP_HOME).
      # Provide the just-built release binaries — same contract as `make dev-env`.
      - name: Build release binaries
        run: make build

      - name: Put mp + raul on PATH
        run: echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"

      - name: make ci
        env:
          NEXTTEST: 1
        run: make ci

  tap-update:
    name: open homebrew-tap bump PR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout master-plan (so `git rev-list` can resolve the tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag + commit SHA + SHA256
        id: meta
        # Two DIFFERENT tarballs get their own sha256. master-plan.rb points at
        # the tag archive; master-plan-dev.rb points at the commit archive. GitHub
        # names the archive's root directory after the ref vs the sha
        # (master-plan-1.0.0-rc6/ vs master-plan-f4964f7b/), so the two archives
        # are never byte-identical and one SHA cannot serve both formulas.
        # Writing a single SHA into both guarantees `brew upgrade` fails with
        # "Formula reports different checksum" on every tag bump.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          SHORT_SHA="${COMMIT:0:8}"
          TAG_SHA=$(curl -sL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" | sha256sum | cut -d ' ' -f1)
          DEV_SHA=$(curl -sL "https://github.com/${GITHUB_REPOSITORY}/archive/${COMMIT}.tar.gz" | sha256sum | cut -d ' ' -f1)
          DATE=$(date -u +%Y%m%d)
          echo "version=${VERSION}"       >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}"         >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}"   >> "$GITHUB_OUTPUT"
          echo "tag_sha=${TAG_SHA}"       >> "$GITHUB_OUTPUT"
          echo "dev_sha=${DEV_SHA}"       >> "$GITHUB_OUTPUT"
          echo "date=${DATE}"             >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: lthiagol/homebrew-tap
          ref: main
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update both formulas on a new branch
        working-directory: homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION:   ${{ steps.meta.outputs.version }}
          COMMIT:    ${{ steps.meta.outputs.commit }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          TAG_SHA:   ${{ steps.meta.outputs.tag_sha }}
          DEV_SHA:   ${{ steps.meta.outputs.dev_sha }}
          DATE:      ${{ steps.meta.outputs.date }}
        run: |
          BRANCH="bump-master-plan-v${VERSION}"
          git remote set-url origin "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/lthiagol/homebrew-tap.git"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"

          sed -i.bak -E \
            -e "s|^  homepage \".*\"|  homepage \"https://github.com/${GITHUB_REPOSITORY}\"|" \
            -e "s|^  url \".*\"|  url \"https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz\"|" \
            -e "s|^  version \".*\"|  version \"${VERSION}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${TAG_SHA}\"|" \
            Formula/master-plan.rb

          # Dev formula: url is the COMMIT archive, so sha256 must be the
          # commit archive's. Version carries the short sha to match the shape
          # dev-tap-update.yml writes for a plain wip push.
          sed -i.bak -E \
            -e "s|^  homepage \".*\"|  homepage \"https://github.com/${GITHUB_REPOSITORY}\"|" \
            -e "s|^  url \".*\"|  url \"https://github.com/${GITHUB_REPOSITORY}/archive/${COMMIT}.tar.gz\"|" \
            -e "s|^  version \".*\"|  version \"${VERSION}-dev.${DATE}-${SHORT_SHA}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${DEV_SHA}\"|" \
            Formula/master-plan-dev.rb

          rm -f Formula/*.bak
          git add Formula/master-plan.rb Formula/master-plan-dev.rb
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "master-plan: bump to v${VERSION} (and master-plan-dev to ${VERSION}-dev.${DATE}-${SHORT_SHA})"
          git push -u origin "$BRANCH" --force

      - name: Open PR against homebrew-tap:main
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          BRANCH="bump-master-plan-v${{ steps.meta.outputs.version }}"
          VERSION="${{ steps.meta.outputs.version }}"
          DATE="${{ steps.meta.outputs.date }}"
          SHA="${{ steps.meta.outputs.tag_sha }}"
          DEV_SHA="${{ steps.meta.outputs.dev_sha }}"
          COMMIT="${{ steps.meta.outputs.commit }}"
          cat > /tmp/pr_body.md <<PRBODY
          Auto-bump from ${{ github.repository }} tag v${VERSION}.

          * master-plan.rb -> v${VERSION} tag archive, sha256 ${SHA}
          * master-plan-dev.rb -> ${VERSION}-dev.${DATE}-${{ steps.meta.outputs.short_sha }} (commit archive ${COMMIT:0:7}), sha256 ${DEV_SHA}

          The two formulas point at two different archives (tag vs commit), so
          each carries its own sha256.

          This PR targets main. The tap's stable-ci job runs ruby -c + brew style.
          PRBODY
          gh pr create --repo lthiagol/homebrew-tap --base main --head "$BRANCH" --title "master-plan: bump to v${VERSION}" --body-file /tmp/pr_body.md || echo "PR already exists for this bump"
          # Same auto-merge contract as dev-tap-update.yml: the tap's own CI
          # (ruby -c + brew style) is the gate for a formula bump.
          PR_NUMBER=$(gh pr list --repo lthiagol/homebrew-tap --state open --head "$BRANCH" --json number --jq '.[0].number')
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            gh pr merge --auto --squash --repo lthiagol/homebrew-tap "$PR_NUMBER" \
              || echo "auto-merge setup skipped (PR not mergeable yet)"
          else
            echo "no open PR found for branch $BRANCH; skipping auto-merge"
          fi